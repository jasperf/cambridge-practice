<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="800" viewBox="0 0 1080 800" font-family="Montserrat,Helvetica,Arial,DejaVu Sans,sans-serif">
<rect width="1080" height="800" fill="#FBF5E9"/><rect width="14" height="800" fill="#1C6DD0"/>
<text xml:space="preserve" x="56.0" y="62.0" font-size="20" font-weight="700" fill="#1C6DD0" letter-spacing="2">SECONDARY 2 MATHS · TEST DAY</text>
<text xml:space="preserve" x="56.0" y="108.0" font-size="40" font-weight="800" fill="#14213D">Circle Formula Triangles</text>
<text xml:space="preserve" x="56.0" y="136.0" font-size="20" font-weight="400" fill="#5B6478">Circumference · radius and diameter · area: cover what you want, read off the rest</text>
<rect x="56" y="170" width="308" height="560" rx="16" fill="#fff" stroke="#EADFCB"/>
<text xml:space="preserve" x="210.0" y="212.0" font-size="24" font-weight="800" fill="#1C6DD0" text-anchor="middle">Circumference</text>
<polygon points="210.0,240.0 85.0,400.0 335.0,400.0" fill="#FBF5E9" stroke="#14213D" stroke-width="4" stroke-linejoin="round"/>
<line x1="147.5" y1="320.0" x2="272.5" y2="320.0" stroke="#14213D" stroke-width="4" stroke-linecap="round"/><line x1="210.0" y1="320.0" x2="210.0" y2="400.0" stroke="#14213D" stroke-width="4" stroke-linecap="round"/>
<text xml:space="preserve" x="210.0" y="306.0" font-size="40" font-weight="800" fill="#E8590C" text-anchor="middle">C</text>
<text xml:space="preserve" x="160.0" y="374.0" font-size="40" font-weight="800" fill="#E8590C" text-anchor="middle">π</text>
<text xml:space="preserve" x="260.0" y="374.0" font-size="40" font-weight="800" fill="#E8590C" text-anchor="middle">d</text>
<text xml:space="preserve" x="210.0" y="460.0" font-size="26" font-weight="700" fill="#14213D" text-anchor="middle" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">C = π × d</text>
<text xml:space="preserve" x="210.0" y="498.0" font-size="26" font-weight="700" fill="#14213D" text-anchor="middle" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">d = C ÷ π</text>
<text xml:space="preserve" x="210.0" y="536.0" font-size="26" font-weight="700" fill="#14213D" text-anchor="middle" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">π = C ÷ d</text>
<text xml:space="preserve" x="210.0" y="582.0" font-size="16" font-weight="400" fill="#5B6478" text-anchor="middle">C and d in cm · π has no unit</text>
<rect x="76" y="604" width="268" height="104" rx="10" fill="#FBF5E9"/>
<text xml:space="preserve" x="210.0" y="634.0" font-size="18" font-weight="400" fill="#14213D" text-anchor="middle">Example: d = 12 cm</text>
<text xml:space="preserve" x="210.0" y="664.0" font-size="18" font-weight="400" fill="#14213D" text-anchor="middle">C = π × 12</text>
<text xml:space="preserve" x="210.0" y="694.0" font-size="18" font-weight="700" fill="#14213D" text-anchor="middle">C = 37.7 cm (1 d.p.)</text>
<rect x="386" y="170" width="308" height="560" rx="16" fill="#14213D"/>
<text xml:space="preserve" x="540.0" y="212.0" font-size="24" font-weight="800" fill="#FFB27A" text-anchor="middle">Radius ⇄ diameter</text>
<text xml:space="preserve" x="540.0" y="340.0" font-size="64" font-weight="800" fill="#fff" text-anchor="middle">r ⇄ d</text>
<text xml:space="preserve" x="540.0" y="460.0" font-size="28" font-weight="700" fill="#fff" text-anchor="middle" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">d = 2 × r</text>
<text xml:space="preserve" x="540.0" y="506.0" font-size="28" font-weight="700" fill="#fff" text-anchor="middle" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">r = d ÷ 2</text>
<text xml:space="preserve" x="540.0" y="552.0" font-size="17" font-weight="400" fill="#EADFCB" text-anchor="middle">C needs d, A needs r:</text>
<text xml:space="preserve" x="540.0" y="576.0" font-size="17" font-weight="400" fill="#EADFCB" text-anchor="middle">double or halve first</text>
<rect x="406" y="604" width="268" height="104" rx="10" fill="#1F3159"/>
<text xml:space="preserve" x="540.0" y="634.0" font-size="18" font-weight="400" fill="#fff" text-anchor="middle">Example: d = 18 cm</text>
<text xml:space="preserve" x="540.0" y="664.0" font-size="18" font-weight="400" fill="#fff" text-anchor="middle">r = 18 ÷ 2</text>
<text xml:space="preserve" x="540.0" y="694.0" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">r = 9 cm</text>
<rect x="716" y="170" width="308" height="560" rx="16" fill="#fff" stroke="#EADFCB"/>
<text xml:space="preserve" x="870.0" y="212.0" font-size="24" font-weight="800" fill="#1C6DD0" text-anchor="middle">Area</text>
<polygon points="870.0,240.0 745.0,400.0 995.0,400.0" fill="#FBF5E9" stroke="#14213D" stroke-width="4" stroke-linejoin="round"/>
<line x1="807.5" y1="320.0" x2="932.5" y2="320.0" stroke="#14213D" stroke-width="4" stroke-linecap="round"/><line x1="870.0" y1="320.0" x2="870.0" y2="400.0" stroke="#14213D" stroke-width="4" stroke-linecap="round"/>
<text xml:space="preserve" x="870.0" y="306.0" font-size="40" font-weight="800" fill="#E8590C" text-anchor="middle">A</text>
<text xml:space="preserve" x="820.0" y="374.0" font-size="40" font-weight="800" fill="#E8590C" text-anchor="middle">π</text>
<text xml:space="preserve" x="920.0" y="374.0" font-size="40" font-weight="800" fill="#E8590C" text-anchor="middle">r²</text>
<text xml:space="preserve" x="870.0" y="460.0" font-size="26" font-weight="700" fill="#14213D" text-anchor="middle" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">A = π × r²</text>
<text xml:space="preserve" x="870.0" y="498.0" font-size="26" font-weight="700" fill="#14213D" text-anchor="middle" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">r² = A ÷ π</text>
<text xml:space="preserve" x="870.0" y="536.0" font-size="26" font-weight="700" fill="#14213D" text-anchor="middle" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">r = √(A ÷ π)</text>
<text xml:space="preserve" x="870.0" y="582.0" font-size="16" font-weight="400" fill="#5B6478" text-anchor="middle">A in cm² · r in cm</text>
<rect x="736" y="604" width="268" height="104" rx="10" fill="#FBF5E9"/>
<text xml:space="preserve" x="870.0" y="634.0" font-size="18" font-weight="400" fill="#14213D" text-anchor="middle">Example: A = 80 cm²</text>
<text xml:space="preserve" x="870.0" y="664.0" font-size="18" font-weight="400" fill="#14213D" text-anchor="middle">r² = 80 ÷ π = 25.46…</text>
<text xml:space="preserve" x="870.0" y="694.0" font-size="18" font-weight="700" fill="#14213D" text-anchor="middle">r = √25.46… = 5.0 cm</text>
<text xml:space="preserve" x="56.0" y="772.0" font-size="16" font-weight="400" fill="#5B6478">Tip: the area triangle gives r², so take the square root last. Keep the full π value until the end.</text>
</svg>
