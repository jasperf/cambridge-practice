<rect x="550" y="582" width="474" height="250" rx="16" fill="#fff" stroke="#EADFCB"/>
<text xml:space="preserve" x="574.0" y="630.0" font-size="24" font-weight="800" fill="#14213D" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">−4x ≤ 12</text>
<text xml:space="preserve" x="574.0" y="672.0" font-size="22" font-weight="800" fill="#E8590C" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">  x ≥ −3     (÷ −4)</text>
<text xml:space="preserve" x="574.0" y="722.0" font-size="19" font-weight="800" fill="#E8590C">× or ÷ by a NEGATIVE</text>
<text xml:space="preserve" x="574.0" y="750.0" font-size="19" font-weight="800" fill="#E8590C">→ turn the sign round</text>
<text xml:space="preserve" x="574.0" y="792.0" font-size="18" font-weight="700" fill="#5B6478">Why: 2 &lt; 5, but −2 &gt; −5</text>
<text xml:space="preserve" x="56.0" y="872.0" font-size="24" font-weight="800" fill="#E8590C">Double inequalities: do the same to all three parts</text>
