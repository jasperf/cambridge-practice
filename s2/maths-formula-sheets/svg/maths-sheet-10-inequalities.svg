<text xml:space="preserve" x="80.0" y="630.0" font-size="24" font-weight="800" fill="#14213D" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">5x − 3 &gt; 17</text>
<text xml:space="preserve" x="80.0" y="672.0" font-size="21" font-weight="700" fill="#5B6478" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">5x &gt; 20      (+3)</text>
<text xml:space="preserve" x="80.0" y="712.0" font-size="22" font-weight="800" fill="#1C6DD0" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace"> x &gt; 4       (÷5)</text>
<text xml:space="preserve" x="80.0" y="762.0" font-size="17" font-weight="400" fill="#5B6478">Answer is a range, not one number:</text>
<text xml:space="preserve" x="80.0" y="790.0" font-size="17" font-weight="700" fill="#14213D">4.1, 5, 100 … all work</text>
