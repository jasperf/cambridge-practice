<text xml:space="preserve" x="80.0" y="936.0" font-size="24" font-weight="800" fill="#14213D" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">1 &lt; 2x + 3 ≤ 11</text>
<text xml:space="preserve" x="80.0" y="976.0" font-size="21" font-weight="700" fill="#5B6478" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">−2 &lt; 2x ≤ 8         (−3 everywhere)</text>
<text xml:space="preserve" x="80.0" y="1016.0" font-size="22" font-weight="800" fill="#1C6DD0" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">−1 &lt; x ≤ 4          (÷2 everywhere)</text>
<text xml:space="preserve" x="80.0" y="1056.0" font-size="17" font-weight="700" fill="#14213D">Whole numbers that fit: 0, 1, 2, 3, 4   (not −1: the circle is open)</text>
<text xml:space="preserve" x="56.0" y="1118.0" font-size="24" font-weight="800" fill="#E8590C">Checklist</text>
<rect x="56" y="1134" width="968" height="140" rx="16" fill="#fff" stroke="#EADFCB"/>
<circle cx="92" cy="1170" r="13" fill="#1C6DD0"/>
<text xml:space="preserve" x="118.0" y="1177.0" font-size="19" font-weight="700" fill="#14213D">Keep the sign the same way round unless you × or ÷ by a negative.</text>
<circle cx="92" cy="1210" r="13" fill="#1C6DD0"/>
<text xml:space="preserve" x="118.0" y="1217.0" font-size="19" font-weight="700" fill="#14213D">&lt; or &gt; → open circle ○        ≤ or ≥ → filled circle ●</text>
<circle cx="92" cy="1250" r="13" fill="#1C6DD0"/>
<text xml:space="preserve" x="118.0" y="1257.0" font-size="19" font-weight="700" fill="#14213D">Check: pick a number in your answer and test it in the original.</text>
