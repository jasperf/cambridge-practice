<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1400" viewBox="0 0 1080 1400" font-family="Montserrat,Helvetica,Arial,DejaVu Sans,sans-serif">
<rect width="1080" height="1400" fill="#FBF5E9"/><rect width="14" height="1400" fill="#1C6DD0"/>
<text xml:space="preserve" x="56.0" y="62.0" font-size="20" font-weight="700" fill="#1C6DD0" letter-spacing="2">SECONDARY 2 MATHS · SHEET 4 OF 5</text>
<text xml:space="preserve" x="56.0" y="108.0" font-size="40" font-weight="800" fill="#14213D">Circles</text>
<text xml:space="preserve" x="56.0" y="136.0" font-size="20" font-weight="400" fill="#5B6478">Term 2 · Unit 7.1 · circumference and area</text>
<text xml:space="preserve" x="56.0" y="180.0" font-size="24" font-weight="800" fill="#E8590C">Parts of a circle and the two formulas</text>
<rect x="56" y="196" width="968" height="360" rx="16" fill="#fff" stroke="#EADFCB"/>
<circle cx="220.0" cy="392.0" r="132.0" fill="#DCE9FA" stroke="#E8590C" stroke-width="6"/>
<line x1="88.0" y1="392.0" x2="352.0" y2="392.0" stroke="#1C6DD0" stroke-width="4" stroke-linecap="round"/>
<line x1="220.0" y1="392.0" x2="282.0" y2="275.5" stroke="#14213D" stroke-width="4" stroke-linecap="round"/>
<circle cx="220.0" cy="392.0" r="6.0" fill="#14213D" stroke="none" stroke-width="0"/>
<text xml:space="preserve" x="198.0" y="418.0" font-size="20" font-weight="800" fill="#14213D">O</text>
<text xml:space="preserve" x="286.0" y="380.0" font-size="16" font-weight="800" fill="#1C6DD0" text-anchor="middle">d (diameter)</text>
<text xml:space="preserve" x="265.0" y="337.7" font-size="24" font-weight="800" fill="#14213D">r</text>
<text xml:space="preserve" x="220.0" y="248.0" font-size="16" font-weight="800" fill="#E8590C" text-anchor="middle">circumference: the distance round</text>
<text xml:space="preserve" x="420.0" y="252.0" font-size="22" font-weight="700" fill="#14213D" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">d = 2 × r     r = d ÷ 2</text>
<text xml:space="preserve" x="420.0" y="318.0" font-size="38" font-weight="800" fill="#1C6DD0" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">C = π × d</text>
<text xml:space="preserve" x="420.0" y="348.0" font-size="19" font-weight="400" fill="#5B6478" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">or C = 2 × π × r</text>
<text xml:space="preserve" x="420.0" y="420.0" font-size="38" font-weight="800" fill="#1C6DD0" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">A = π × r²</text>
<text xml:space="preserve" x="420.0" y="450.0" font-size="19" font-weight="400" fill="#5B6478">square the radius only, then × π</text>
<text xml:space="preserve" x="420.0" y="510.0" font-size="20" font-weight="800" fill="#E8590C">Circumference uses d. Area uses r.</text>
<text xml:space="preserve" x="420.0" y="538.0" font-size="18" font-weight="400" fill="#5B6478">π = 3.14159… Use the π button.</text>
<text xml:space="preserve" x="56.0" y="596.0" font-size="24" font-weight="800" fill="#E8590C">Working backwards</text>
<rect x="56" y="612" width="474" height="250" rx="16" fill="#fff" stroke="#EADFCB"/>
<text xml:space="preserve" x="80.0" y="652.0" font-size="22" font-weight="800" fill="#1C6DD0">From the circumference</text>
<text xml:space="preserve" x="80.0" y="702.0" font-size="22" font-weight="700" fill="#14213D" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">C = 40 cm</text>
<text xml:space="preserve" x="80.0" y="742.0" font-size="22" font-weight="700" fill="#14213D" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">d = C ÷ π</text>
<text xml:space="preserve" x="80.0" y="782.0" font-size="22" font-weight="700" fill="#14213D" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">d = 40 ÷ π</text>
<text xml:space="preserve" x="80.0" y="822.0" font-size="22" font-weight="700" fill="#14213D" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">d = 12.7 cm (1 d.p.)</text>
<rect x="550" y="612" width="474" height="250" rx="16" fill="#fff" stroke="#EADFCB"/>
<text xml:space="preserve" x="574.0" y="652.0" font-size="22" font-weight="800" fill="#1C6DD0">From the area</text>
<text xml:space="preserve" x="574.0" y="702.0" font-size="22" font-weight="700" fill="#14213D" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">A = 60 cm²</text>
<text xml:space="preserve" x="574.0" y="742.0" font-size="22" font-weight="700" fill="#14213D" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">r² = A ÷ π = 19.09…</text>
<text xml:space="preserve" x="574.0" y="782.0" font-size="22" font-weight="700" fill="#14213D" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">r  = √19.09…</text>
<text xml:space="preserve" x="574.0" y="822.0" font-size="22" font-weight="700" fill="#14213D" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">r  = 4.4 cm (1 d.p.)</text>
<text xml:space="preserve" x="56.0" y="902.0" font-size="24" font-weight="800" fill="#E8590C">Semicircles and quarter circles</text>
<rect x="56" y="918" width="968" height="270" rx="16" fill="#fff" stroke="#EADFCB"/>
<path d="M190.0,1080.0 L300.0,1080.0 A110,110 0 0 0 80.0,1080.0 Z" fill="#DCE9FA" stroke="none"/>
<path d="M300.0,1080.0 A110,110 0 0 0 80.0,1080.0" fill="none" stroke="#E8590C" stroke-width="5" stroke-linecap="round"/>
<line x1="80.0" y1="1080.0" x2="300.0" y2="1080.0" stroke="#1C6DD0" stroke-width="4" stroke-linecap="round"/>
<text xml:space="preserve" x="190.0" y="1110.0" font-size="18" font-weight="800" fill="#1C6DD0" text-anchor="middle">d = 10 cm</text>
<text xml:space="preserve" x="330.0" y="982.0" font-size="19" font-weight="700" fill="#14213D" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">A = ½ × π × 5²</text>
<text xml:space="preserve" x="330.0" y="1012.0" font-size="19" font-weight="700" fill="#14213D" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">  = 39.3 cm²</text>
<text xml:space="preserve" x="330.0" y="1042.0" font-size="19" font-weight="700" fill="#14213D" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">P = ½ × π × 10 + 10</text>
<text xml:space="preserve" x="330.0" y="1072.0" font-size="19" font-weight="700" fill="#14213D" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">  = 25.7 cm</text>
<path d="M590.0,1140.0 L740.0,1140.0 A150,150 0 0 0 590.0,990.0 Z" fill="#DCE9FA" stroke="none"/>
<path d="M740.0,1140.0 A150,150 0 0 0 590.0,990.0" fill="none" stroke="#E8590C" stroke-width="5" stroke-linecap="round"/>
<line x1="590.0" y1="1140.0" x2="740.0" y2="1140.0" stroke="#1C6DD0" stroke-width="4" stroke-linecap="round"/>
<line x1="590.0" y1="1140.0" x2="590.0" y2="990.0" stroke="#1C6DD0" stroke-width="4" stroke-linecap="round"/>
<polyline points="604.0,1140.0 604.0,1126.0 590.0,1126.0" fill="none" stroke="#14213D" stroke-width="2.5"/>
<text xml:space="preserve" x="665.0" y="1168.0" font-size="18" font-weight="800" fill="#1C6DD0" text-anchor="middle">r = 4 cm</text>
<text xml:space="preserve" x="770.0" y="982.0" font-size="19" font-weight="700" fill="#14213D" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">A = ¼ × π × 4²</text>
<text xml:space="preserve" x="770.0" y="1012.0" font-size="19" font-weight="700" fill="#14213D" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">  = 12.6 cm²</text>
<text xml:space="preserve" x="770.0" y="1042.0" font-size="19" font-weight="700" fill="#14213D" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">P = ¼ × 2π × 4</text>
<text xml:space="preserve" x="770.0" y="1072.0" font-size="19" font-weight="700" fill="#14213D" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">    + 4 + 4</text>
<text xml:space="preserve" x="770.0" y="1102.0" font-size="19" font-weight="700" fill="#14213D" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">  = 14.3 cm</text>
<text xml:space="preserve" x="330.0" y="1150.0" font-size="17" font-weight="700" fill="#E8590C">Perimeter: add the</text>
<text xml:space="preserve" x="330.0" y="1172.0" font-size="17" font-weight="700" fill="#E8590C">straight edges too!</text>
<text xml:space="preserve" x="56.0" y="1228.0" font-size="24" font-weight="800" fill="#E8590C">Rounding and answers in terms of π</text>
<rect x="56" y="1244" width="968" height="92" rx="16" fill="#fff" stroke="#EADFCB"/>
<text xml:space="preserve" x="80.0" y="1280.0" font-size="19" font-weight="700" fill="#14213D" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">π × 7² = 153.938…  →  153.9 (1 d.p.)  →  154 (3 s.f.)</text>
<text xml:space="preserve" x="80.0" y="1316.0" font-size="19" font-weight="700" fill="#1C6DD0" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">In terms of π: r = 7 → A = 49π cm², C = 14π cm.   ✗ (π × 7)²</text>
<text xml:space="preserve" x="56.0" y="1374.0" font-size="18" font-weight="400" fill="#5B6478">Formula sheets · Jasper</text>
</svg>
