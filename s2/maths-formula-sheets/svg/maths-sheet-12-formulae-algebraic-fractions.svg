<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1340" viewBox="0 0 1080 1340" font-family="Montserrat,Helvetica,Arial,DejaVu Sans,sans-serif">
<rect width="1080" height="1340" fill="#FBF5E9"/><rect width="14" height="1340" fill="#1C6DD0"/>
<text letter-spacing="2" xml:space="preserve" x="56.0" y="62.0" font-size="20" font-weight="700" fill="#1C6DD0">SECONDARY 2 MATHS · SHEET 12 OF 12</text>
<text xml:space="preserve" x="56.0" y="108.0" font-size="40" font-weight="800" fill="#14213D">Formulae &amp; Algebraic Fractions</text>
<text xml:space="preserve" x="56.0" y="136.0" font-size="20" font-weight="400" fill="#5B6478">Term 1 · Unit 2 · substitute, rearrange, add and subtract fractions</text>
<text xml:space="preserve" x="56.0" y="180.0" font-size="24" font-weight="800" fill="#E8590C">Substitute: brackets round negatives, powers first</text>
<rect x="56" y="196" width="968" height="150" rx="16" fill="#fff" stroke="#EADFCB"/>
<text xml:space="preserve" x="80.0" y="244.0" font-size="22" font-weight="800" fill="#14213D" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">2a² − 3b   when a = −4, b = 2</text>
<text xml:space="preserve" x="80.0" y="284.0" font-size="22" font-weight="700" fill="#1C6DD0" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">= 2 × (−4)² − 3 × 2  =  2 × 16 − 6  =  26</text>
<text xml:space="preserve" x="80.0" y="322.0" font-size="17" font-weight="400" fill="#5B6478">(−4)² = 16 is positive. Square BEFORE you multiply by 2.</text>
<text xml:space="preserve" x="56.0" y="386.0" font-size="24" font-weight="800" fill="#E8590C">Rearrange: undo the operations in reverse order</text>
<rect x="56" y="402" width="968" height="330" rx="16" fill="#fff" stroke="#EADFCB"/>
<text xml:space="preserve" x="80.0" y="446.0" font-size="20" font-weight="800" fill="#1C6DD0">Make w the subject of  P = 2(l + w)</text>
<rect x="100" y="470" width="120" height="56" rx="10" fill="#DCE9FA" stroke="#14213D" stroke-width="2"/>
<text xml:space="preserve" x="160.0" y="507.0" font-size="22" font-weight="800" fill="#14213D" text-anchor="middle" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">w</text>
<line x1="224.0" y1="498.0" x2="274.0" y2="498.0" stroke="#14213D" stroke-width="2.5" stroke-linecap="round"/>
<polygon points="278,498 268,492 268,504" fill="#14213D"/>
<rect x="280" y="470" width="120" height="56" rx="10" fill="#FDE1CF" stroke="#14213D" stroke-width="2"/>
<text xml:space="preserve" x="340.0" y="507.0" font-size="22" font-weight="800" fill="#14213D" text-anchor="middle" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">+ l</text>
<line x1="404.0" y1="498.0" x2="454.0" y2="498.0" stroke="#14213D" stroke-width="2.5" stroke-linecap="round"/>
<polygon points="458,498 448,492 448,504" fill="#14213D"/>
<rect x="460" y="470" width="120" height="56" rx="10" fill="#FDE1CF" stroke="#14213D" stroke-width="2"/>
<text xml:space="preserve" x="520.0" y="507.0" font-size="22" font-weight="800" fill="#14213D" text-anchor="middle" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">× 2</text>
<line x1="584.0" y1="498.0" x2="634.0" y2="498.0" stroke="#14213D" stroke-width="2.5" stroke-linecap="round"/>
<polygon points="638,498 628,492 628,504" fill="#14213D"/>
<rect x="640" y="470" width="120" height="56" rx="10" fill="#DCE9FA" stroke="#14213D" stroke-width="2"/>
<text xml:space="preserve" x="700.0" y="507.0" font-size="22" font-weight="800" fill="#14213D" text-anchor="middle" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">P</text>
<text xml:space="preserve" x="800.0" y="494.0" font-size="16" font-weight="700" fill="#5B6478">forwards: build P</text>
<text xml:space="preserve" x="800.0" y="520.0" font-size="16" font-weight="700" fill="#E8590C">backwards: undo</text>
<text xml:space="preserve" x="80.0" y="580.0" font-size="22" font-weight="800" fill="#1C6DD0" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">P ÷ 2 = l + w   →   w = P/2 − l</text>
<text xml:space="preserve" x="80.0" y="630.0" font-size="20" font-weight="800" fill="#1C6DD0">With a square:  E = ½mv²,  make v the subject</text>
<text xml:space="preserve" x="80.0" y="672.0" font-size="22" font-weight="800" fill="#14213D" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">2E = mv²  →  v² = 2E/m  →  v = √(2E/m)</text>
<text xml:space="preserve" x="80.0" y="706.0" font-size="17" font-weight="400" fill="#5B6478">×2 first (undo ½), then ÷m, then square root.</text>
<text xml:space="preserve" x="56.0" y="772.0" font-size="24" font-weight="800" fill="#E8590C">Add and subtract algebraic fractions</text>
<rect x="56" y="788" width="968" height="330" rx="16" fill="#fff" stroke="#EADFCB"/>
<text xml:space="preserve" x="80.0" y="832.0" font-size="20" font-weight="800" fill="#1C6DD0">Same as numbers: common denominator first</text>
<text xml:space="preserve" x="80.0" y="876.0" font-size="22" font-weight="700" fill="#14213D" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">x/2 + x/5  =  5x/10 + 2x/10  =  7x/10</text>
<text xml:space="preserve" x="80.0" y="932.0" font-size="22" font-weight="800" fill="#14213D" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">(x + 1)/3 + (x − 4)/2</text>
<text xml:space="preserve" x="80.0" y="970.0" font-size="21" font-weight="700" fill="#1C6DD0" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">= [2(x + 1) + 3(x − 4)] / 6  =  (5x − 10)/6</text>
<text xml:space="preserve" x="80.0" y="1026.0" font-size="22" font-weight="800" fill="#14213D" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">(x + 2)/4 − (x − 3)/3</text>
<text xml:space="preserve" x="80.0" y="1064.0" font-size="21" font-weight="700" fill="#1C6DD0" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">= [3(x + 2) − 4(x − 3)] / 12  =  (18 − x)/12</text>
<text xml:space="preserve" x="80.0" y="1098.0" font-size="17" font-weight="700" fill="#E8590C">Minus a bracket: −4 × −3 = +12. Keep the bracket until you expand it.</text>
<text xml:space="preserve" x="56.0" y="1158.0" font-size="24" font-weight="800" fill="#E8590C">Words → algebra</text>
<rect x="56" y="1174" width="968" height="96" rx="16" fill="#fff" stroke="#EADFCB"/>
<text xml:space="preserve" x="80.0" y="1214.0" font-size="20" font-weight="700" fill="#14213D" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">“3 more than twice n” → 2n + 3</text>
<text xml:space="preserve" x="80.0" y="1250.0" font-size="20" font-weight="700" fill="#14213D" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">“5 less than half of n” → n/2 − 5</text>
<text xml:space="preserve" x="620.0" y="1214.0" font-size="20" font-weight="700" fill="#14213D" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">“the square of (n + 1)”</text>
<text xml:space="preserve" x="620.0" y="1250.0" font-size="20" font-weight="700" fill="#14213D" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">→ (n + 1)²</text>
<text xml:space="preserve" x="56.0" y="1314.0" font-size="18" font-weight="400" fill="#5B6478">Formula sheets · Jasper</text>
</svg>
