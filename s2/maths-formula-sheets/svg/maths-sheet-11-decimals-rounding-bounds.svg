<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1340" viewBox="0 0 1080 1340" font-family="Montserrat,Helvetica,Arial,DejaVu Sans,sans-serif">
<rect width="1080" height="1340" fill="#FBF5E9"/><rect width="14" height="1340" fill="#1C6DD0"/>
<text letter-spacing="2" xml:space="preserve" x="56.0" y="62.0" font-size="20" font-weight="700" fill="#1C6DD0">SECONDARY 2 MATHS · SHEET 11 OF 12</text>
<text xml:space="preserve" x="56.0" y="108.0" font-size="40" font-weight="800" fill="#14213D">Decimals, Rounding &amp; Bounds</text>
<text xml:space="preserve" x="56.0" y="136.0" font-size="20" font-weight="400" fill="#5B6478">Term 1 · Unit 3 · equivalent calculations, s.f., bounds and percentages</text>
<text xml:space="preserve" x="56.0" y="180.0" font-size="24" font-weight="800" fill="#E8590C">Decimals without a calculator</text>
<rect x="56" y="196" width="968" height="210" rx="16" fill="#fff" stroke="#EADFCB"/>
<text xml:space="preserve" x="80.0" y="240.0" font-size="20" font-weight="800" fill="#1C6DD0">Multiply: count decimal places</text>
<text xml:space="preserve" x="80.0" y="284.0" font-size="24" font-weight="800" fill="#14213D" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">0.4 × 0.03</text>
<text xml:space="preserve" x="80.0" y="320.0" font-size="20" font-weight="700" fill="#5B6478" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">4 × 3 = 12</text>
<text xml:space="preserve" x="80.0" y="356.0" font-size="22" font-weight="800" fill="#1C6DD0" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">1 + 2 = 3 d.p. → 0.012</text>
<text xml:space="preserve" x="560.0" y="240.0" font-size="20" font-weight="800" fill="#E8590C">Divide: make the divisor whole</text>
<text xml:space="preserve" x="560.0" y="284.0" font-size="24" font-weight="800" fill="#14213D" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">2.4 ÷ 0.08</text>
<text xml:space="preserve" x="560.0" y="320.0" font-size="20" font-weight="700" fill="#5B6478" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">×100 both: 240 ÷ 8</text>
<text xml:space="preserve" x="560.0" y="356.0" font-size="22" font-weight="800" fill="#1C6DD0" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">= 30</text>
<text xml:space="preserve" x="560.0" y="390.0" font-size="16" font-weight="400" fill="#5B6478">÷ 10⁻² is the same as × 100</text>
<text xml:space="preserve" x="56.0" y="446.0" font-size="24" font-weight="800" fill="#E8590C">Significant figures: start at the first non-zero digit</text>
<rect x="56" y="462" width="968" height="130" rx="16" fill="#fff" stroke="#EADFCB"/>
<text xml:space="preserve" x="80.0" y="510.0" font-size="22" font-weight="800" fill="#14213D" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">0.045 82 → 0.046  (2 s.f.)</text>
<text xml:space="preserve" x="80.0" y="546.0" font-size="16" font-weight="400" fill="#5B6478">leading zeros do not count</text>
<text xml:space="preserve" x="560.0" y="510.0" font-size="22" font-weight="800" fill="#14213D" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">38 649 → 38 600  (3 s.f.)</text>
<text xml:space="preserve" x="560.0" y="546.0" font-size="16" font-weight="400" fill="#5B6478">keep the place value: fill with zeros</text>
<text xml:space="preserve" x="56.0" y="632.0" font-size="24" font-weight="800" fill="#E8590C">Bounds: half a unit either side</text>
<rect x="56" y="648" width="968" height="300" rx="16" fill="#fff" stroke="#EADFCB"/>
<text xml:space="preserve" x="80.0" y="692.0" font-size="20" font-weight="800" fill="#1C6DD0">6.3 cm to 1 d.p.  (unit 0.1 → half is 0.05)</text>
<line x1="100.0" y1="770.0" x2="780.0" y2="770.0" stroke="#14213D" stroke-width="2" stroke-linecap="round"/>
<line x1="120.0" y1="764.0" x2="120.0" y2="776.0" stroke="#14213D" stroke-width="1.5" stroke-linecap="round"/>
<text xml:space="preserve" x="120.0" y="800.0" font-size="15" font-weight="700" fill="#5B6478" text-anchor="middle">6.2</text>
<line x1="200.0" y1="764.0" x2="200.0" y2="776.0" stroke="#14213D" stroke-width="1.5" stroke-linecap="round"/>
<line x1="280.0" y1="764.0" x2="280.0" y2="776.0" stroke="#14213D" stroke-width="1.5" stroke-linecap="round"/>
<text xml:space="preserve" x="280.0" y="800.0" font-size="15" font-weight="700" fill="#5B6478" text-anchor="middle">6.25</text>
<line x1="360.0" y1="764.0" x2="360.0" y2="776.0" stroke="#14213D" stroke-width="1.5" stroke-linecap="round"/>
<line x1="440.0" y1="764.0" x2="440.0" y2="776.0" stroke="#14213D" stroke-width="1.5" stroke-linecap="round"/>
<text xml:space="preserve" x="440.0" y="800.0" font-size="15" font-weight="700" fill="#5B6478" text-anchor="middle">6.3</text>
<line x1="520.0" y1="764.0" x2="520.0" y2="776.0" stroke="#14213D" stroke-width="1.5" stroke-linecap="round"/>
<line x1="600.0" y1="764.0" x2="600.0" y2="776.0" stroke="#14213D" stroke-width="1.5" stroke-linecap="round"/>
<text xml:space="preserve" x="600.0" y="800.0" font-size="15" font-weight="700" fill="#5B6478" text-anchor="middle">6.35</text>
<line x1="680.0" y1="764.0" x2="680.0" y2="776.0" stroke="#14213D" stroke-width="1.5" stroke-linecap="round"/>
<line x1="760.0" y1="764.0" x2="760.0" y2="776.0" stroke="#14213D" stroke-width="1.5" stroke-linecap="round"/>
<text xml:space="preserve" x="760.0" y="800.0" font-size="15" font-weight="700" fill="#5B6478" text-anchor="middle">6.4</text>
<line x1="280.0" y1="770.0" x2="600.0" y2="770.0" stroke="#E8590C" stroke-width="6" stroke-linecap="round"/>
<circle cx="280.0" cy="770.0" r="8" fill="#E8590C" stroke="#E8590C" stroke-width="3"/>
<circle cx="600.0" cy="770.0" r="8" fill="#fff" stroke="#E8590C" stroke-width="3"/>
<text xml:space="preserve" x="280.0" y="748.0" font-size="17" font-weight="800" fill="#E8590C" text-anchor="middle">LB 6.25</text>
<text xml:space="preserve" x="600.0" y="748.0" font-size="17" font-weight="800" fill="#E8590C" text-anchor="middle">UB 6.35</text>
<text xml:space="preserve" x="440.0" y="748.0" font-size="17" font-weight="800" fill="#1C6DD0" text-anchor="middle">6.3</text>
<text xml:space="preserve" x="80.0" y="850.0" font-size="24" font-weight="800" fill="#14213D" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">6.25 ≤ length &lt; 6.35</text>
<text xml:space="preserve" x="80.0" y="890.0" font-size="19" font-weight="700" fill="#14213D" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">2700 to the nearest 100:  2650 ≤ n &lt; 2750</text>
<text xml:space="preserve" x="80.0" y="924.0" font-size="17" font-weight="400" fill="#5B6478">Whole things (people, cars): largest is 2749.</text>
<text xml:space="preserve" x="56.0" y="988.0" font-size="24" font-weight="800" fill="#E8590C">Bounds in calculations</text>
<rect x="56" y="1004" width="474" height="150" rx="16" fill="#fff" stroke="#EADFCB"/>
<text xml:space="preserve" x="80.0" y="1044.0" font-size="19" font-weight="800" fill="#1C6DD0">Max of a + b, a × b:</text>
<text xml:space="preserve" x="80.0" y="1076.0" font-size="21" font-weight="700" fill="#14213D" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">UB and UB</text>
<text xml:space="preserve" x="80.0" y="1112.0" font-size="19" font-weight="800" fill="#E8590C">Max of a − b, a ÷ b:</text>
<text xml:space="preserve" x="80.0" y="1142.0" font-size="21" font-weight="700" fill="#14213D" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">UB of a, LB of b</text>
<text xml:space="preserve" x="550.0" y="988.0" font-size="24" font-weight="800" fill="#E8590C">Percentages with multipliers</text>
<rect x="550" y="1004" width="474" height="260" rx="16" fill="#fff" stroke="#EADFCB"/>
<text xml:space="preserve" x="574.0" y="1046.0" font-size="19" font-weight="700" fill="#14213D">+15%</text>
<text xml:space="preserve" x="1000.0" y="1046.0" font-size="21" font-weight="800" fill="#1C6DD0" text-anchor="end" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">× 1.15</text>
<text xml:space="preserve" x="574.0" y="1102.0" font-size="19" font-weight="700" fill="#14213D">−20%</text>
<text xml:space="preserve" x="1000.0" y="1102.0" font-size="21" font-weight="800" fill="#1C6DD0" text-anchor="end" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">× 0.80</text>
<text xml:space="preserve" x="574.0" y="1158.0" font-size="19" font-weight="700" fill="#14213D">+4% for 3 years</text>
<text xml:space="preserve" x="1000.0" y="1158.0" font-size="21" font-weight="800" fill="#1C6DD0" text-anchor="end" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">× 1.04³</text>
<text xml:space="preserve" x="574.0" y="1214.0" font-size="19" font-weight="700" fill="#14213D">Reverse: +25% gave 80</text>
<text xml:space="preserve" x="1000.0" y="1214.0" font-size="21" font-weight="800" fill="#1C6DD0" text-anchor="end" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">80 ÷ 1.25 = 64</text>
<text xml:space="preserve" x="56.0" y="1200.0" font-size="18" font-weight="700" fill="#14213D">Reverse percentage: divide by</text>
<text xml:space="preserve" x="56.0" y="1228.0" font-size="18" font-weight="700" fill="#14213D">the multiplier; never take 25% off.</text>
<text xml:space="preserve" x="56.0" y="1314.0" font-size="18" font-weight="400" fill="#5B6478">Formula sheets · Jasper</text>
</svg>
