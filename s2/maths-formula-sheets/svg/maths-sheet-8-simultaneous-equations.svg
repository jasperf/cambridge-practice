<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1340" viewBox="0 0 1080 1340" font-family="Montserrat,Helvetica,Arial,DejaVu Sans,sans-serif">
<rect width="1080" height="1340" fill="#FBF5E9"/><rect width="14" height="1340" fill="#1C6DD0"/>
<text letter-spacing="2" xml:space="preserve" x="56.0" y="62.0" font-size="20" font-weight="700" fill="#1C6DD0">SECONDARY 2 MATHS · SHEET 8 OF 12</text>
<text xml:space="preserve" x="56.0" y="108.0" font-size="40" font-weight="800" fill="#14213D">Simultaneous Equations</text>
<text xml:space="preserve" x="56.0" y="136.0" font-size="20" font-weight="400" fill="#5B6478">Term 1 · Unit 4 · two equations, two unknowns, one answer that fits both</text>
<text xml:space="preserve" x="56.0" y="180.0" font-size="24" font-weight="800" fill="#E8590C">Elimination in 5 steps</text>
<rect x="56" y="196" width="968" height="420" rx="16" fill="#fff" stroke="#EADFCB"/>
<circle cx="92" cy="240" r="18" fill="#1C6DD0"/>
<text xml:space="preserve" x="92.0" y="247.0" font-size="19" font-weight="800" fill="#fff" text-anchor="middle">1</text>
<text xml:space="preserve" x="124.0" y="248.0" font-size="22" font-weight="800" fill="#14213D">Label the equations.</text>
<text xml:space="preserve" x="470.0" y="248.0" font-size="22" font-weight="700" fill="#1C6DD0" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">① 4x + 3y = 25    ② 2x + y = 11</text>
<circle cx="92" cy="316" r="18" fill="#1C6DD0"/>
<text xml:space="preserve" x="92.0" y="323.0" font-size="19" font-weight="800" fill="#fff" text-anchor="middle">2</text>
<text xml:space="preserve" x="124.0" y="324.0" font-size="22" font-weight="800" fill="#14213D">Make one letter match.</text>
<text xml:space="preserve" x="470.0" y="324.0" font-size="22" font-weight="700" fill="#1C6DD0" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">② × 3:  6x + 3y = 33   ③</text>
<circle cx="92" cy="392" r="18" fill="#1C6DD0"/>
<text xml:space="preserve" x="92.0" y="399.0" font-size="19" font-weight="800" fill="#fff" text-anchor="middle">3</text>
<text xml:space="preserve" x="124.0" y="400.0" font-size="22" font-weight="800" fill="#14213D">Same sign? SUBTRACT.</text>
<text xml:space="preserve" x="470.0" y="400.0" font-size="22" font-weight="700" fill="#1C6DD0" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">③ − ①:  2x = 8</text>
<circle cx="92" cy="468" r="18" fill="#1C6DD0"/>
<text xml:space="preserve" x="92.0" y="475.0" font-size="19" font-weight="800" fill="#fff" text-anchor="middle">4</text>
<text xml:space="preserve" x="124.0" y="476.0" font-size="22" font-weight="800" fill="#14213D">Solve, then substitute back.</text>
<text xml:space="preserve" x="470.0" y="476.0" font-size="22" font-weight="700" fill="#1C6DD0" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">x = 4.  In ②: 8 + y = 11, so y = 3</text>
<circle cx="92" cy="544" r="18" fill="#2B8A3E"/>
<text xml:space="preserve" x="92.0" y="551.0" font-size="19" font-weight="800" fill="#fff" text-anchor="middle">5</text>
<text xml:space="preserve" x="124.0" y="552.0" font-size="22" font-weight="800" fill="#14213D">Check in the other equation.</text>
<text xml:space="preserve" x="470.0" y="552.0" font-size="22" font-weight="700" fill="#2B8A3E" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">In ①: 16 + 9 = 25 ✓</text>
<text xml:space="preserve" x="56.0" y="656.0" font-size="24" font-weight="800" fill="#E8590C">Add or subtract?</text>
<text xml:space="preserve" x="550.0" y="656.0" font-size="24" font-weight="800" fill="#E8590C">Or substitute</text>
<rect x="56" y="672" width="474" height="300" rx="16" fill="#fff" stroke="#EADFCB"/>
<rect x="550" y="672" width="474" height="300" rx="16" fill="#fff" stroke="#EADFCB"/>
<text xml:space="preserve" x="80.0" y="712.0" font-size="20" font-weight="700" fill="#14213D">Look at the matching letter:</text>
<text xml:space="preserve" x="80.0" y="748.0" font-size="21" font-weight="800" fill="#1C6DD0">same signs → SUBTRACT</text>
<text xml:space="preserve" x="80.0" y="780.0" font-size="21" font-weight="800" fill="#E8590C">different signs → ADD</text>
<text xml:space="preserve" x="80.0" y="830.0" font-size="22" font-weight="700" fill="#14213D" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">  3x + y = 14</text>
<text xml:space="preserve" x="80.0" y="862.0" font-size="22" font-weight="700" fill="#14213D" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">+ x − y = 2</text>
<line x1="80.0" y1="876.0" x2="300.0" y2="876.0" stroke="#14213D" stroke-width="2" stroke-linecap="round"/>
<text xml:space="preserve" x="80.0" y="908.0" font-size="22" font-weight="700" fill="#E8590C" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">  4x     = 16</text>
<text xml:space="preserve" x="80.0" y="946.0" font-size="21" font-weight="800" fill="#1C6DD0" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">x = 4, then y = 2</text>
<text xml:space="preserve" x="574.0" y="712.0" font-size="20" font-weight="700" fill="#14213D">Use it when one equation</text>
<text xml:space="preserve" x="574.0" y="738.0" font-size="20" font-weight="700" fill="#14213D">already says y = …</text>
<text xml:space="preserve" x="574.0" y="786.0" font-size="20" font-weight="700" fill="#14213D" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">y = 2x − 1  and  x + y = 8</text>
<text xml:space="preserve" x="574.0" y="826.0" font-size="21" font-weight="700" fill="#5B6478" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">x + (2x − 1) = 8</text>
<text xml:space="preserve" x="574.0" y="862.0" font-size="21" font-weight="700" fill="#5B6478" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">3x − 1 = 8, so 3x = 9</text>
<text xml:space="preserve" x="574.0" y="898.0" font-size="21" font-weight="800" fill="#1C6DD0" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">x = 3</text>
<text xml:space="preserve" x="574.0" y="934.0" font-size="21" font-weight="800" fill="#1C6DD0" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">y = 2 × 3 − 1 = 5</text>
<text xml:space="preserve" x="56.0" y="1012.0" font-size="24" font-weight="800" fill="#E8590C">The answer is where the two lines cross</text>
<rect x="56" y="1028" width="968" height="236" rx="16" fill="#fff" stroke="#EADFCB"/>
<line x1="110.0" y1="1238.0" x2="297.0" y2="1238.0" stroke="#14213D" stroke-width="2" stroke-linecap="round"/>
<line x1="110.0" y1="1238.0" x2="110.0" y2="1040.0" stroke="#14213D" stroke-width="2" stroke-linecap="round"/>
<line x1="132.0" y1="1238.0" x2="132.0" y2="1243.0" stroke="#14213D" stroke-width="1.5" stroke-linecap="round"/>
<line x1="110.0" y1="1216.0" x2="105.0" y2="1216.0" stroke="#14213D" stroke-width="1.5" stroke-linecap="round"/>
<line x1="154.0" y1="1238.0" x2="154.0" y2="1243.0" stroke="#14213D" stroke-width="1.5" stroke-linecap="round"/>
<line x1="110.0" y1="1194.0" x2="105.0" y2="1194.0" stroke="#14213D" stroke-width="1.5" stroke-linecap="round"/>
<line x1="176.0" y1="1238.0" x2="176.0" y2="1243.0" stroke="#14213D" stroke-width="1.5" stroke-linecap="round"/>
<line x1="110.0" y1="1172.0" x2="105.0" y2="1172.0" stroke="#14213D" stroke-width="1.5" stroke-linecap="round"/>
<line x1="198.0" y1="1238.0" x2="198.0" y2="1243.0" stroke="#14213D" stroke-width="1.5" stroke-linecap="round"/>
<line x1="110.0" y1="1150.0" x2="105.0" y2="1150.0" stroke="#14213D" stroke-width="1.5" stroke-linecap="round"/>
<line x1="220.0" y1="1238.0" x2="220.0" y2="1243.0" stroke="#14213D" stroke-width="1.5" stroke-linecap="round"/>
<line x1="110.0" y1="1128.0" x2="105.0" y2="1128.0" stroke="#14213D" stroke-width="1.5" stroke-linecap="round"/>
<line x1="242.0" y1="1238.0" x2="242.0" y2="1243.0" stroke="#14213D" stroke-width="1.5" stroke-linecap="round"/>
<line x1="110.0" y1="1106.0" x2="105.0" y2="1106.0" stroke="#14213D" stroke-width="1.5" stroke-linecap="round"/>
<line x1="264.0" y1="1238.0" x2="264.0" y2="1243.0" stroke="#14213D" stroke-width="1.5" stroke-linecap="round"/>
<line x1="110.0" y1="1084.0" x2="105.0" y2="1084.0" stroke="#14213D" stroke-width="1.5" stroke-linecap="round"/>
<line x1="286.0" y1="1238.0" x2="286.0" y2="1243.0" stroke="#14213D" stroke-width="1.5" stroke-linecap="round"/>
<line x1="110.0" y1="1062.0" x2="105.0" y2="1062.0" stroke="#14213D" stroke-width="1.5" stroke-linecap="round"/>
<text xml:space="preserve" x="305.0" y="1244.0" font-size="16" font-weight="800" fill="#5B6478">x</text>
<text xml:space="preserve" x="104.0" y="1034.0" font-size="16" font-weight="800" fill="#5B6478">y</text>
<line x1="121.0" y1="1238.0" x2="209.0" y2="1062.0" stroke="#1C6DD0" stroke-width="3.5" stroke-linecap="round"/>
<line x1="110.0" y1="1062.0" x2="286.0" y2="1238.0" stroke="#E8590C" stroke-width="3.5" stroke-linecap="round"/>
<circle cx="176" cy="1128" r="7" fill="#2B8A3E"/>
<text xml:space="preserve" x="188.0" y="1118.0" font-size="18" font-weight="800" fill="#2B8A3E">(3, 5)</text>
<text xml:space="preserve" x="215.2" y="1066.0" font-size="16" font-weight="800" fill="#1C6DD0">y = 2x − 1</text>
<text xml:space="preserve" x="233.2" y="1176.4" font-size="16" font-weight="800" fill="#E8590C">x + y = 8</text>
<text xml:space="preserve" x="340.0" y="1090.0" font-size="18" font-weight="400" fill="#5B6478">Same pair as the</text>
<text xml:space="preserve" x="340.0" y="1116.0" font-size="18" font-weight="400" fill="#5B6478">substitution example:</text>
<text xml:space="preserve" x="340.0" y="1150.0" font-size="18" font-weight="700" fill="#2B8A3E">both lines pass</text>
<text xml:space="preserve" x="340.0" y="1176.0" font-size="18" font-weight="700" fill="#2B8A3E">through (3, 5).</text>
<line x1="620.0" y1="1048.0" x2="620.0" y2="1244.0" stroke="#EADFCB" stroke-width="2" stroke-linecap="round"/>
<text xml:space="preserve" x="644.0" y="1072.0" font-size="20" font-weight="800" fill="#1C6DD0">Word problem</text>
<text xml:space="preserve" x="644.0" y="1104.0" font-size="19" font-weight="700" fill="#14213D" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">3 pens + 2 rulers = $13</text>
<text xml:space="preserve" x="644.0" y="1132.0" font-size="19" font-weight="700" fill="#14213D" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">1 pen  + 2 rulers = $7</text>
<text xml:space="preserve" x="644.0" y="1170.0" font-size="19" font-weight="700" fill="#5B6478" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">Subtract: 2 pens = $6</text>
<text xml:space="preserve" x="644.0" y="1200.0" font-size="19" font-weight="800" fill="#1C6DD0" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">pen = $3, ruler = $2</text>
<text xml:space="preserve" x="644.0" y="1232.0" font-size="16" font-weight="400" fill="#5B6478">Write “let p = cost of a pen” first.</text>
<text xml:space="preserve" x="56.0" y="1290.0" font-size="18" font-weight="700" fill="#14213D">Always give BOTH values, and check them in the equation you did not use.</text>
<text xml:space="preserve" x="56.0" y="1314.0" font-size="18" font-weight="400" fill="#5B6478">Formula sheets · Jasper</text>
</svg>
