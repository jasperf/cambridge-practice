<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1340" viewBox="0 0 1080 1340" font-family="Montserrat,Helvetica,Arial,DejaVu Sans,sans-serif">
<rect width="1080" height="1340" fill="#FBF5E9"/><rect width="14" height="1340" fill="#1C6DD0"/>
<text letter-spacing="2" xml:space="preserve" x="56.0" y="62.0" font-size="20" font-weight="700" fill="#1C6DD0">SECONDARY 2 MATHS · SHEET 9 OF 12</text>
<text xml:space="preserve" x="56.0" y="108.0" font-size="40" font-weight="800" fill="#14213D">Indices, Standard Form &amp; Rational Numbers</text>
<text xml:space="preserve" x="56.0" y="136.0" font-size="20" font-weight="400" fill="#5B6478">Term 1 · Unit 1 · same base only for the index laws</text>
<text xml:space="preserve" x="56.0" y="180.0" font-size="24" font-weight="800" fill="#E8590C">The index laws</text>
<rect x="56" y="196" width="312" height="134" rx="16" fill="#fff" stroke="#EADFCB"/>
<text xml:space="preserve" x="76.0" y="232.0" font-size="19" font-weight="800" fill="#1C6DD0">× → ADD the powers</text>
<text xml:space="preserve" x="76.0" y="276.0" font-size="26" font-weight="800" fill="#14213D" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">a³ × a⁴ = a⁷</text>
<text xml:space="preserve" x="76.0" y="308.0" font-size="17" font-weight="400" fill="#5B6478">3 + 4 = 7</text>
<rect x="384" y="196" width="312" height="134" rx="16" fill="#fff" stroke="#EADFCB"/>
<text xml:space="preserve" x="404.0" y="232.0" font-size="19" font-weight="800" fill="#1C6DD0">÷ → SUBTRACT</text>
<text xml:space="preserve" x="404.0" y="276.0" font-size="26" font-weight="800" fill="#14213D" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">a⁹ ÷ a⁵ = a⁴</text>
<text xml:space="preserve" x="404.0" y="308.0" font-size="17" font-weight="400" fill="#5B6478">9 − 5 = 4</text>
<rect x="712" y="196" width="312" height="134" rx="16" fill="#fff" stroke="#EADFCB"/>
<text xml:space="preserve" x="732.0" y="232.0" font-size="19" font-weight="800" fill="#1C6DD0">Power of a power → ×</text>
<text xml:space="preserve" x="732.0" y="276.0" font-size="26" font-weight="800" fill="#14213D" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">(a²)⁵ = a¹⁰</text>
<text xml:space="preserve" x="732.0" y="308.0" font-size="17" font-weight="400" fill="#5B6478">2 × 5 = 10</text>
<rect x="56" y="346" width="312" height="134" rx="16" fill="#fff" stroke="#EADFCB"/>
<text xml:space="preserve" x="76.0" y="382.0" font-size="19" font-weight="800" fill="#1C6DD0">Power 0 → 1</text>
<text xml:space="preserve" x="76.0" y="426.0" font-size="26" font-weight="800" fill="#14213D" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">7⁰ = 1</text>
<text xml:space="preserve" x="76.0" y="458.0" font-size="17" font-weight="400" fill="#5B6478">anything (not 0) to the 0 is 1</text>
<rect x="384" y="346" width="312" height="134" rx="16" fill="#fff" stroke="#EADFCB"/>
<text xml:space="preserve" x="404.0" y="382.0" font-size="19" font-weight="800" fill="#1C6DD0">Negative → one over</text>
<text xml:space="preserve" x="404.0" y="426.0" font-size="26" font-weight="800" fill="#14213D" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">3⁻² = 1/9</text>
<text xml:space="preserve" x="404.0" y="458.0" font-size="17" font-weight="400" fill="#5B6478">not −9: it is 1 ÷ 3²</text>
<rect x="712" y="346" width="312" height="134" rx="16" fill="#fff" stroke="#EADFCB"/>
<text xml:space="preserve" x="732.0" y="382.0" font-size="19" font-weight="800" fill="#E8590C">Different bases?</text>
<text xml:space="preserve" x="732.0" y="426.0" font-size="26" font-weight="800" fill="#14213D" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">2³ × 3²</text>
<text xml:space="preserve" x="732.0" y="458.0" font-size="17" font-weight="400" fill="#5B6478">cannot combine: work out 8 × 9</text>
<text xml:space="preserve" x="56.0" y="526.0" font-size="24" font-weight="800" fill="#E8590C">Standard form:  A × 10ⁿ  with  1 ≤ A &lt; 10</text>
<rect x="56" y="542" width="968" height="200" rx="16" fill="#fff" stroke="#EADFCB"/>
<text xml:space="preserve" x="80.0" y="592.0" font-size="20" font-weight="800" fill="#1C6DD0">Big number → positive power</text>
<text xml:space="preserve" x="80.0" y="640.0" font-size="26" font-weight="800" fill="#14213D" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">47 000 = 4.7 × 10⁴</text>
<text xml:space="preserve" x="80.0" y="680.0" font-size="17" font-weight="400" fill="#5B6478">the point moves 4 places</text>
<text xml:space="preserve" x="560.0" y="592.0" font-size="20" font-weight="800" fill="#E8590C">Small number → negative power</text>
<text xml:space="preserve" x="560.0" y="640.0" font-size="26" font-weight="800" fill="#14213D" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">0.0036 = 3.6 × 10⁻³</text>
<text xml:space="preserve" x="560.0" y="680.0" font-size="17" font-weight="400" fill="#5B6478">the point moves 3 places</text>
<text xml:space="preserve" x="80.0" y="722.0" font-size="17" font-weight="700" fill="#14213D">Not standard form: 47 × 10³ and 0.47 × 10⁵ (A must be at least 1 and less than 10).</text>
<text xml:space="preserve" x="56.0" y="782.0" font-size="24" font-weight="800" fill="#E8590C">Calculating: numbers with numbers, powers with powers</text>
<rect x="56" y="798" width="968" height="170" rx="16" fill="#fff" stroke="#EADFCB"/>
<text xml:space="preserve" x="80.0" y="844.0" font-size="22" font-weight="700" fill="#14213D" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">(2 × 10³) × (6 × 10⁵)</text>
<text xml:space="preserve" x="80.0" y="882.0" font-size="22" font-weight="700" fill="#5B6478" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">= 12 × 10⁸</text>
<text xml:space="preserve" x="80.0" y="920.0" font-size="24" font-weight="800" fill="#1C6DD0" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">= 1.2 × 10⁹</text>
<text xml:space="preserve" x="80.0" y="952.0" font-size="16" font-weight="400" fill="#5B6478">12 is too big: fix A, add 1 to n</text>
<text xml:space="preserve" x="560.0" y="844.0" font-size="22" font-weight="700" fill="#14213D" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">(9 × 10⁴) ÷ (3 × 10⁻²)</text>
<text xml:space="preserve" x="560.0" y="882.0" font-size="22" font-weight="700" fill="#5B6478" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">9 ÷ 3 = 3</text>
<text xml:space="preserve" x="560.0" y="920.0" font-size="24" font-weight="800" fill="#1C6DD0" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">= 3 × 10⁶</text>
<text xml:space="preserve" x="560.0" y="952.0" font-size="16" font-weight="400" fill="#5B6478">4 − (−2) = 6</text>
<text xml:space="preserve" x="56.0" y="1008.0" font-size="24" font-weight="800" fill="#E8590C">Rational or irrational?</text>
<rect x="56" y="1024" width="474" height="240" rx="16" fill="#fff" stroke="#EADFCB"/>
<rect x="550" y="1024" width="474" height="240" rx="16" fill="#fff" stroke="#EADFCB"/>
<text xml:space="preserve" x="80.0" y="1062.0" font-size="20" font-weight="800" fill="#1C6DD0">Rational: can be a fraction p/q</text>
<text xml:space="preserve" x="80.0" y="1100.0" font-size="21" font-weight="700" fill="#14213D" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">0.75 = 3/4</text>
<text xml:space="preserve" x="80.0" y="1132.0" font-size="21" font-weight="700" fill="#14213D" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">0.333… = 1/3</text>
<text xml:space="preserve" x="80.0" y="1164.0" font-size="21" font-weight="700" fill="#14213D" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">√49 = 7 = 7/1</text>
<text xml:space="preserve" x="80.0" y="1204.0" font-size="20" font-weight="800" fill="#E8590C">Irrational: never ends, never repeats</text>
<text xml:space="preserve" x="80.0" y="1240.0" font-size="21" font-weight="700" fill="#14213D" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">√2   √10   π   √3 + 1</text>
<text xml:space="preserve" x="574.0" y="1062.0" font-size="20" font-weight="800" fill="#1C6DD0">Recurring decimal → fraction</text>
<text xml:space="preserve" x="574.0" y="1100.0" font-size="20" font-weight="700" fill="#14213D" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">   x = 0.181818…</text>
<text xml:space="preserve" x="574.0" y="1132.0" font-size="20" font-weight="700" fill="#14213D" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">100x = 18.181818…</text>
<text xml:space="preserve" x="574.0" y="1164.0" font-size="20" font-weight="700" fill="#5B6478" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace"> 99x = 18</text>
<text xml:space="preserve" x="574.0" y="1204.0" font-size="22" font-weight="800" fill="#1C6DD0" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">   x = 18/99 = 2/11</text>
<text xml:space="preserve" x="574.0" y="1240.0" font-size="16" font-weight="400" fill="#5B6478">2 digits repeat → use 100x</text>
<text xml:space="preserve" x="56.0" y="1294.0" font-size="17" font-weight="700" fill="#14213D">Square numbers to know: 1, 4, 9, 16, 25, 36, 49, 64, 81, 100, 121, 144, 169.</text>
<text xml:space="preserve" x="56.0" y="1314.0" font-size="18" font-weight="400" fill="#5B6478">Formula sheets · Jasper</text>
</svg>
