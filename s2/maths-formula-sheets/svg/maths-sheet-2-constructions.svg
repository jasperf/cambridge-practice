<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1300" viewBox="0 0 1080 1300" font-family="Montserrat,Helvetica,Arial,DejaVu Sans,sans-serif">
<rect width="1080" height="1300" fill="#FBF5E9"/><rect width="14" height="1300" fill="#1C6DD0"/>
<text xml:space="preserve" x="56.0" y="62.0" font-size="20" font-weight="700" fill="#1C6DD0" letter-spacing="2">SECONDARY 2 MATHS · SHEET 2 OF 6</text>
<text xml:space="preserve" x="56.0" y="108.0" font-size="40" font-weight="800" fill="#14213D">Constructions</text>
<text xml:space="preserve" x="56.0" y="136.0" font-size="20" font-weight="400" fill="#5B6478">Term 2 · Unit 5 Angles · ruler and compasses only</text>
<text xml:space="preserve" x="56.0" y="180.0" font-size="24" font-weight="800" fill="#E8590C">Bisect an angle (cut it exactly in half)</text>
<rect x="56" y="196" width="968" height="360" rx="16" fill="#fff" stroke="#EADFCB"/>
<line x1="100.0" y1="510.0" x2="460.0" y2="510.0" stroke="#14213D" stroke-width="4" stroke-linecap="round"/>
<line x1="100.0" y1="510.0" x2="312.1" y2="257.2" stroke="#14213D" stroke-width="4" stroke-linecap="round"/>
<path d="M249.2,525.7 A150,150 0 0 0 183.9,385.6" fill="none" stroke="#E8590C" stroke-width="2.5" stroke-linecap="round"/>
<path d="M349.3,426.1 A130,130 0 0 0 298.3,389.3" fill="none" stroke="#E8590C" stroke-width="2.5" stroke-linecap="round"/>
<path d="M319.9,435.7 A130,130 0 0 0 324.5,372.9" fill="none" stroke="#E8590C" stroke-width="2.5" stroke-linecap="round"/>
<line x1="100.0" y1="510.0" x2="408.1" y2="366.3" stroke="#1C6DD0" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="8 6"/>
<path d="M160.0,510.0 A60,60 0 0 0 154.4,484.6" fill="none" stroke="#1C6DD0" stroke-width="3" stroke-linecap="round"/>
<path d="M163.4,480.4 A70,70 0 0 0 145.0,456.4" fill="none" stroke="#1C6DD0" stroke-width="3" stroke-linecap="round"/>
<circle cx="100.0" cy="510.0" r="5.0" fill="#14213D" stroke="none" stroke-width="0"/>
<text xml:space="preserve" x="74.0" y="518.0" font-size="22" font-weight="800" fill="#14213D">O</text>
<circle cx="250.0" cy="510.0" r="5.0" fill="#14213D" stroke="none" stroke-width="0"/>
<text xml:space="preserve" x="254.0" y="540.0" font-size="22" font-weight="800" fill="#14213D">A</text>
<circle cx="196.4" cy="395.1" r="5.0" fill="#14213D" stroke="none" stroke-width="0"/>
<text xml:space="preserve" x="168.4" y="389.1" font-size="22" font-weight="800" fill="#14213D">B</text>
<circle cx="326.1" cy="404.6" r="5.0" fill="#14213D" stroke="none" stroke-width="0"/>
<text xml:space="preserve" x="334.1" y="392.6" font-size="22" font-weight="800" fill="#14213D">P</text>
<circle cx="520.0" cy="245.0" r="18.0" fill="#1C6DD0" stroke="none" stroke-width="0"/>
<text xml:space="preserve" x="520.0" y="252.0" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">1</text>
<text xml:space="preserve" x="552.0" y="252.0" font-size="20" font-weight="400" fill="#14213D">Compasses on O. Draw an arc that</text>
<text xml:space="preserve" x="552.0" y="280.0" font-size="20" font-weight="400" fill="#14213D">crosses both arms at A and B.</text>
<circle cx="520.0" cy="343.0" r="18.0" fill="#1C6DD0" stroke="none" stroke-width="0"/>
<text xml:space="preserve" x="520.0" y="350.0" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">2</text>
<text xml:space="preserve" x="552.0" y="350.0" font-size="20" font-weight="400" fill="#14213D">Draw equal arcs from A and from B.</text>
<text xml:space="preserve" x="552.0" y="378.0" font-size="20" font-weight="400" fill="#14213D">They cross at P.</text>
<circle cx="520.0" cy="441.0" r="18.0" fill="#1C6DD0" stroke="none" stroke-width="0"/>
<text xml:space="preserve" x="520.0" y="448.0" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">3</text>
<text xml:space="preserve" x="552.0" y="448.0" font-size="20" font-weight="400" fill="#14213D">Draw the line OP. It splits the</text>
<text xml:space="preserve" x="552.0" y="476.0" font-size="20" font-weight="400" fill="#14213D">angle into two equal halves.</text>
<text xml:space="preserve" x="56.0" y="596.0" font-size="24" font-weight="800" fill="#E8590C">Construct 60°, then bisect to get more angles</text>
<rect x="56" y="612" width="968" height="330" rx="16" fill="#fff" stroke="#EADFCB"/>
<polygon points="100.0,890.0 330.0,890.0 215.0,690.8" fill="#DCE9FA" stroke="#14213D" stroke-width="4" stroke-linejoin="round"/>
<path d="M247.8,713.8 A230,230 0 0 0 178.7,673.9" fill="none" stroke="#E8590C" stroke-width="2.5" stroke-linecap="round"/>
<path d="M251.3,673.9 A230,230 0 0 0 182.2,713.8" fill="none" stroke="#E8590C" stroke-width="2.5" stroke-linecap="round"/>
<path d="M146.0,890.0 A46,46 0 0 0 123.0,850.2" fill="none" stroke="#1C6DD0" stroke-width="3" stroke-linecap="round"/>
<text xml:space="preserve" x="152.0" y="876.0" font-size="20" font-weight="800" fill="#1C6DD0">60°</text>
<text xml:space="preserve" x="72.0" y="898.0" font-size="22" font-weight="800" fill="#14213D">A</text>
<text xml:space="preserve" x="340.0" y="898.0" font-size="22" font-weight="800" fill="#14213D">B</text>
<text xml:space="preserve" x="207.0" y="674.8" font-size="22" font-weight="800" fill="#14213D">C</text>
<text xml:space="preserve" x="440.0" y="664.0" font-size="20" font-weight="400" fill="#14213D">Set the compasses to AB. Arcs from A and B</text>
<text xml:space="preserve" x="440.0" y="692.0" font-size="20" font-weight="400" fill="#14213D">meet at C: an equilateral triangle, so every</text>
<text xml:space="preserve" x="440.0" y="720.0" font-size="20" font-weight="400" fill="#14213D">angle is 60°.</text>
<rect x="440" y="772" width="67" height="40" rx="20" fill="#1C6DD0"/>
<text xml:space="preserve" x="473.5" y="800.0" font-size="21" font-weight="800" fill="#fff" text-anchor="middle">60°</text>
<text xml:space="preserve" x="519.0" y="798.0" font-size="17" font-weight="400" fill="#5B6478">→ bisect →</text>
<rect x="619" y="772" width="67" height="40" rx="20" fill="#DCE9FA"/>
<text xml:space="preserve" x="652.5" y="800.0" font-size="21" font-weight="800" fill="#1C6DD0" text-anchor="middle">30°</text>
<text xml:space="preserve" x="698.0" y="798.0" font-size="17" font-weight="400" fill="#5B6478">→ bisect →</text>
<rect x="798" y="772" width="67" height="40" rx="20" fill="#DCE9FA"/>
<text xml:space="preserve" x="831.5" y="800.0" font-size="21" font-weight="800" fill="#1C6DD0" text-anchor="middle">15°</text>
<rect x="440" y="832" width="67" height="40" rx="20" fill="#1C6DD0"/>
<text xml:space="preserve" x="473.5" y="860.0" font-size="21" font-weight="800" fill="#fff" text-anchor="middle">90°</text>
<text xml:space="preserve" x="519.0" y="858.0" font-size="17" font-weight="400" fill="#5B6478">→ bisect →</text>
<rect x="619" y="832" width="67" height="40" rx="20" fill="#DCE9FA"/>
<text xml:space="preserve" x="652.5" y="860.0" font-size="21" font-weight="800" fill="#1C6DD0" text-anchor="middle">45°</text>
<text xml:space="preserve" x="698.0" y="858.0" font-size="17" font-weight="400" fill="#5B6478">→ bisect →</text>
<rect x="798" y="832" width="97" height="40" rx="20" fill="#DCE9FA"/>
<text xml:space="preserve" x="846.5" y="860.0" font-size="21" font-weight="800" fill="#1C6DD0" text-anchor="middle">22.5°</text>
<text xml:space="preserve" x="440.0" y="912.0" font-size="18" font-weight="400" fill="#5B6478">90° comes from a perpendicular bisector of a line.</text>
<text xml:space="preserve" x="56.0" y="982.0" font-size="24" font-weight="800" fill="#E8590C">Regular polygons inside a circle</text>
<rect x="56" y="998" width="968" height="250" rx="16" fill="#fff" stroke="#EADFCB"/>
<circle cx="160.0" cy="1123.0" r="95.0" fill="none" stroke="#5B6478" stroke-width="2.5"/>
<polygon points="255.0,1123.0 207.5,1040.7 112.5,1040.7 65.0,1123.0 112.5,1205.3 207.5,1205.3" fill="#DCE9FA" stroke="#14213D" stroke-width="3.5" stroke-linejoin="round"/>
<line x1="160.0" y1="1123.0" x2="255.0" y2="1123.0" stroke="#E8590C" stroke-width="3" stroke-linecap="round"/>
<text xml:space="preserve" x="206.0" y="1147.0" font-size="22" font-weight="800" fill="#E8590C" text-anchor="middle">r</text>
<text xml:space="preserve" x="249.2" y="1075.9" font-size="22" font-weight="800" fill="#1C6DD0" text-anchor="middle">r</text>
<circle cx="380.0" cy="1123.0" r="95.0" fill="none" stroke="#5B6478" stroke-width="2.5"/>
<polygon points="475.0,1123.0 380.0,1028.0 285.0,1123.0 380.0,1218.0" fill="#DCE9FA" stroke="#14213D" stroke-width="3.5" stroke-linejoin="round"/>
<line x1="475.0" y1="1123.0" x2="285.0" y2="1123.0" stroke="#E8590C" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="8 6"/>
<line x1="380.0" y1="1028.0" x2="380.0" y2="1218.0" stroke="#E8590C" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="8 6"/>
<polyline points="394.0,1123.0 394.0,1109.0 380.0,1109.0" fill="none" stroke="#14213D" stroke-width="2.5"/>
<text xml:space="preserve" x="445.5" y="1067.5" font-size="22" font-weight="800" fill="#1C6DD0" text-anchor="middle">s</text>
<text xml:space="preserve" x="520.0" y="1042.0" font-size="19" font-weight="400" fill="#14213D">Hexagon: step the compasses, set to the</text>
<text xml:space="preserve" x="520.0" y="1068.0" font-size="19" font-weight="400" fill="#14213D">radius, 6 times round. Side = radius.</text>
<text xml:space="preserve" x="520.0" y="1108.0" font-size="19" font-weight="400" fill="#14213D">Square: two diameters at right angles,</text>
<text xml:space="preserve" x="520.0" y="1134.0" font-size="19" font-weight="400" fill="#14213D">join the ends. s² = r² + r².</text>
<text xml:space="preserve" x="520.0" y="1180.0" font-size="21" font-weight="800" fill="#1C6DD0" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">Angle at the centre = 360° ÷ n</text>
<text xml:space="preserve" x="520.0" y="1214.0" font-size="18" font-weight="700" fill="#14213D">6 sides → 60° · 8 sides → 45° · 5 sides → 72°</text>
<text xml:space="preserve" x="56.0" y="1274.0" font-size="18" font-weight="400" fill="#5B6478">Formula sheets · Jasper</text>
</svg>
