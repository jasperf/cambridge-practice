<text xml:space="preserve" x="278.0" y="1208.0" font-size="16" font-weight="700" fill="#1C6DD0" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">z = 180 − 38 = 142°</text>
<text xml:space="preserve" x="278.0" y="1230.0" font-size="16" font-weight="700" fill="#14213D" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">  (straight line)</text>
