<text xml:space="preserve" x="80.0" y="1004.0" font-size="22" font-weight="800" fill="#1C6DD0">Angles at a point = 360°</text>
<text xml:space="preserve" x="262.0" y="1068.0" font-size="19" font-weight="700" fill="#14213D">Hexagons: 3 × 120°</text>
<text xml:space="preserve" x="262.0" y="1096.0" font-size="19" font-weight="700" fill="#14213D">= 360° ✓ no gaps</text>
<text xml:space="preserve" x="262.0" y="1140.0" font-size="19" font-weight="700" fill="#E8590C">Pentagons: 360 ÷ 108</text>
<text xml:space="preserve" x="262.0" y="1168.0" font-size="19" font-weight="700" fill="#E8590C">= 3.33… ✗ gap left</text>
<text xml:space="preserve" x="574.0" y="1004.0" font-size="22" font-weight="800" fill="#1C6DD0">Set the angles equal to the sum</text>
<text xml:space="preserve" x="574.0" y="1050.0" font-size="20" font-weight="400" fill="#14213D">Quadrilateral:</text>
<text xml:space="preserve" x="574.0" y="1080.0" font-size="20" font-weight="400" fill="#14213D">x, x + 30, 2x, 2x − 30</text>
<text xml:space="preserve" x="574.0" y="1124.0" font-size="21" font-weight="700" fill="#1C6DD0" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">6x = 360  →  x = 60</text>
<text xml:space="preserve" x="574.0" y="1158.0" font-size="21" font-weight="700" fill="#1C6DD0" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">60°, 90°, 120°, 90° ✓</text>
<text xml:space="preserve" x="56.0" y="1274.0" font-size="18" font-weight="400" fill="#5B6478">Formula sheets · Jasper</text>
