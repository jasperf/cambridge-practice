<text xml:space="preserve" x="440.0" y="246.0" font-size="21" font-weight="400" fill="#14213D">A polygon with n sides splits into</text>
<text xml:space="preserve" x="440.0" y="276.0" font-size="21" font-weight="400" fill="#14213D">(n − 2) triangles from one corner.</text>
<text xml:space="preserve" x="440.0" y="326.0" font-size="32" font-weight="800" fill="#1C6DD0" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">Sum = (n − 2) × 180°</text>
<text xml:space="preserve" x="440.0" y="370.0" font-size="21" font-weight="700" fill="#14213D">Hexagon: 4 triangles × 180° = 720°</text>
