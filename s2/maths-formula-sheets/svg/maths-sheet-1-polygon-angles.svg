<text xml:space="preserve" x="240.0" y="760.0" font-size="20" font-weight="700" fill="#1C6DD0" text-anchor="middle">72° × 5</text>
<text xml:space="preserve" x="240.0" y="786.0" font-size="20" font-weight="700" fill="#1C6DD0" text-anchor="middle">= 360°</text>
<text xml:space="preserve" x="440.0" y="632.0" font-size="21" font-weight="700" fill="#14213D">Interior + exterior = 180° (a straight line)</text>
<text xml:space="preserve" x="440.0" y="662.0" font-size="21" font-weight="700" fill="#14213D">Exterior angles of ANY polygon add to 360°</text>
<text xml:space="preserve" x="440.0" y="712.0" font-size="21" font-weight="400" fill="#5B6478">Regular polygon with n sides:</text>
<text xml:space="preserve" x="440.0" y="752.0" font-size="23" font-weight="700" fill="#1C6DD0" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">exterior = 360° ÷ n</text>
<text xml:space="preserve" x="440.0" y="788.0" font-size="23" font-weight="700" fill="#1C6DD0" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">interior = 180° − exterior</text>
<text xml:space="preserve" x="440.0" y="824.0" font-size="23" font-weight="700" fill="#1C6DD0" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">n       = 360° ÷ exterior</text>
<rect x="440" y="842" width="560" height="52" rx="10" fill="#FBF5E9"/>
<text xml:space="preserve" x="458.0" y="876.0" font-size="19" font-weight="700" fill="#14213D">Interior 150° → exterior 30° → n = 360 ÷ 30 = 12</text>
<text xml:space="preserve" x="56.0" y="952.0" font-size="24" font-weight="800" fill="#E8590C">Fitting round a point · angles with algebra</text>
<rect x="56" y="968" width="474" height="250" rx="16" fill="#fff" stroke="#EADFCB"/>
