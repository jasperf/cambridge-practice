<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1180" viewBox="0 0 1080 1180" font-family="Montserrat,Helvetica,Arial,DejaVu Sans,sans-serif">
<rect width="1080" height="1180" fill="#FBF5E9"/><rect width="14" height="1180" fill="#2F9E44"/>
<text x="56" y="62" font-size="20" fill="#2F9E44" font-weight="700" letter-spacing="2">HUMAN BIOLOGY · CELL DIVISION</text>
<text x="56" y="108" font-size="40" fill="#14213D" font-weight="800">Mitosis and Meiosis</text>
<text x="56" y="136" font-size="20" fill="#5B6478">Two ways a cell divides. Count the chromosomes in each new cell.</text>

<rect x="56" y="166" width="476" height="640" rx="16" fill="#fff" stroke="#EADFCB"/>

<rect x="548" y="166" width="476" height="640" rx="16" fill="#fff" stroke="#EADFCB"/>

<text x="294" y="210" font-size="30" fill="#2F9E44" font-weight="800" text-anchor="middle">Mitosis</text>
<text x="294" y="236" font-size="17" fill="#14213D" font-weight="700" text-anchor="middle">1 division → 2 cells</text>
<circle cx="294" cy="330" r="66" fill="#FFF4E6" stroke="#E8590C" stroke-width="3"/><rect x="262.0" y="304.0" width="10" height="52" rx="5.0" fill="#1C6DD0" transform="rotate(0 267.0 330)"/><rect x="280.0" y="304.0" width="10" height="52" rx="5.0" fill="#D6336C" transform="rotate(0 285.0 330)"/><rect x="298.0" y="315.0" width="10" height="30" rx="5.0" fill="#1C6DD0" transform="rotate(0 303.0 330)"/><rect x="316.0" y="315.0" width="10" height="30" rx="5.0" fill="#D6336C" transform="rotate(0 321.0 330)"/>
<g><line x1="274" y1="400" x2="213.9" y2="460.1" stroke="#5B6478" stroke-width="3"/><polygon points="204,470 218.8,465.1 208.9,455.2" fill="#5B6478"/><line x1="314" y1="400" x2="374.1" y2="460.1" stroke="#5B6478" stroke-width="3"/><polygon points="384,470 379.1,455.2 369.2,465.1" fill="#5B6478"/><circle cx="184" cy="540" r="62" fill="#FFF4E6" stroke="#E8590C" stroke-width="3"/><rect x="152.0" y="514.0" width="10" height="52" rx="5.0" fill="#1C6DD0" transform="rotate(0 157.0 540)"/><rect x="170.0" y="514.0" width="10" height="52" rx="5.0" fill="#D6336C" transform="rotate(0 175.0 540)"/><rect x="188.0" y="525.0" width="10" height="30" rx="5.0" fill="#1C6DD0" transform="rotate(0 193.0 540)"/><rect x="206.0" y="525.0" width="10" height="30" rx="5.0" fill="#D6336C" transform="rotate(0 211.0 540)"/><circle cx="404" cy="540" r="62" fill="#FFF4E6" stroke="#E8590C" stroke-width="3"/><rect x="372.0" y="514.0" width="10" height="52" rx="5.0" fill="#1C6DD0" transform="rotate(0 377.0 540)"/><rect x="390.0" y="514.0" width="10" height="52" rx="5.0" fill="#D6336C" transform="rotate(0 395.0 540)"/><rect x="408.0" y="525.0" width="10" height="30" rx="5.0" fill="#1C6DD0" transform="rotate(0 413.0 540)"/><rect x="426.0" y="525.0" width="10" height="30" rx="5.0" fill="#D6336C" transform="rotate(0 431.0 540)"/><animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;0.66;0.7;0.78;0.82;1" dur="9s" repeatCount="indefinite"/></g>
<text x="294" y="640" font-size="17" fill="#14213D" font-weight="700" text-anchor="middle">2 cells, identical to the parent</text>
<text x="294" y="666" font-size="16" fill="#5B6478" text-anchor="middle">4 chromosomes → 4 in each cell</text>
<text x="294" y="692" font-size="16" fill="#5B6478" text-anchor="middle">diploid (2n) · 46 in a human cell</text>
<rect x="96" y="716" width="396" height="66" rx="10" fill="#EBFBEE"/>
<text x="294" y="744" font-size="17" fill="#2F9E44" font-weight="800" text-anchor="middle">Used for growth and repair</text>
<text x="294" y="768" font-size="15" fill="#5B6478" text-anchor="middle">and to grow from zygote to baby</text>
<text x="786" y="210" font-size="30" fill="#D6336C" font-weight="800" text-anchor="middle">Meiosis</text>
<text x="786" y="236" font-size="17" fill="#14213D" font-weight="700" text-anchor="middle">2 divisions → 4 cells</text>
<circle cx="786" cy="310" r="56" fill="#FFF4E6" stroke="#E8590C" stroke-width="3"/><rect x="754.0" y="284.0" width="10" height="52" rx="5.0" fill="#1C6DD0" transform="rotate(0 759.0 310)"/><rect x="772.0" y="284.0" width="10" height="52" rx="5.0" fill="#D6336C" transform="rotate(0 777.0 310)"/><rect x="790.0" y="295.0" width="10" height="30" rx="5.0" fill="#1C6DD0" transform="rotate(0 795.0 310)"/><rect x="808.0" y="295.0" width="10" height="30" rx="5.0" fill="#D6336C" transform="rotate(0 813.0 310)"/>
<g><line x1="766" y1="370" x2="718.5" y2="393.7" stroke="#5B6478" stroke-width="3"/><polygon points="706,400 721.7,400.0 715.4,387.5" fill="#5B6478"/><line x1="806" y1="370" x2="853.5" y2="393.7" stroke="#5B6478" stroke-width="3"/><polygon points="866,400 856.6,387.5 850.3,400.0" fill="#5B6478"/><circle cx="686" cy="438" r="42" fill="#FFF4E6" stroke="#E8590C" stroke-width="3"/><rect x="672.0" y="412.0" width="10" height="52" rx="5.0" fill="#1C6DD0" transform="rotate(0 677.0 438)"/><rect x="690.0" y="423.0" width="10" height="30" rx="5.0" fill="#D6336C" transform="rotate(0 695.0 438)"/><circle cx="886" cy="438" r="42" fill="#FFF4E6" stroke="#E8590C" stroke-width="3"/><rect x="872.0" y="412.0" width="10" height="52" rx="5.0" fill="#D6336C" transform="rotate(0 877.0 438)"/><rect x="890.0" y="423.0" width="10" height="30" rx="5.0" fill="#1C6DD0" transform="rotate(0 895.0 438)"/><animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;0.66;0.7;0.76;0.80;1" dur="9s" repeatCount="indefinite"/></g>
<g><line x1="686" y1="482" x2="633.1" y2="512.9" stroke="#5B6478" stroke-width="3"/><polygon points="621,520 636.6,519.0 629.6,506.9" fill="#5B6478"/><circle cx="621" cy="562" r="40" fill="#FFF0F6" stroke="#D6336C" stroke-width="3"/><rect x="607.0" y="536.0" width="10" height="52" rx="5.0" fill="#1C6DD0" transform="rotate(0 612.0 562)"/><rect x="625.0" y="547.0" width="10" height="30" rx="5.0" fill="#D6336C" transform="rotate(0 630.0 562)"/><line x1="686" y1="482" x2="720.3" y2="511.0" stroke="#5B6478" stroke-width="3"/><polygon points="731,520 724.8,505.6 715.8,516.3" fill="#5B6478"/><circle cx="731" cy="562" r="40" fill="#FFF0F6" stroke="#D6336C" stroke-width="3"/><rect x="717.0" y="536.0" width="10" height="52" rx="5.0" fill="#1C6DD0" transform="rotate(0 722.0 562)"/><rect x="735.0" y="547.0" width="10" height="30" rx="5.0" fill="#D6336C" transform="rotate(0 740.0 562)"/><line x1="886" y1="482" x2="851.7" y2="511.0" stroke="#5B6478" stroke-width="3"/><polygon points="841,520 856.2,516.3 847.2,505.6" fill="#5B6478"/><circle cx="841" cy="562" r="40" fill="#FFF0F6" stroke="#D6336C" stroke-width="3"/><rect x="827.0" y="536.0" width="10" height="52" rx="5.0" fill="#D6336C" transform="rotate(0 832.0 562)"/><rect x="845.0" y="547.0" width="10" height="30" rx="5.0" fill="#1C6DD0" transform="rotate(0 850.0 562)"/><line x1="886" y1="482" x2="938.9" y2="512.9" stroke="#5B6478" stroke-width="3"/><polygon points="951,520 942.4,506.9 935.4,519.0" fill="#5B6478"/><circle cx="951" cy="562" r="40" fill="#FFF0F6" stroke="#D6336C" stroke-width="3"/><rect x="937.0" y="536.0" width="10" height="52" rx="5.0" fill="#D6336C" transform="rotate(0 942.0 562)"/><rect x="955.0" y="547.0" width="10" height="30" rx="5.0" fill="#1C6DD0" transform="rotate(0 960.0 562)"/><animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;0.66;0.7;0.86;0.90;1" dur="9s" repeatCount="indefinite"/></g>
<text x="786" y="640" font-size="17" fill="#14213D" font-weight="700" text-anchor="middle">4 cells, all different</text>
<text x="786" y="666" font-size="16" fill="#5B6478" text-anchor="middle">4 chromosomes → 2 in each cell (half)</text>
<text x="786" y="692" font-size="16" fill="#5B6478" text-anchor="middle">haploid (n) · 23 in a human gamete</text>
<rect x="588" y="716" width="396" height="66" rx="10" fill="#FFF0F6"/>
<text x="786" y="744" font-size="17" fill="#D6336C" font-weight="800" text-anchor="middle">Used to make gametes</text>
<text x="786" y="768" font-size="15" fill="#5B6478" text-anchor="middle">sperm in the testes, eggs in the ovaries</text>
<rect x="76.0" y="819.0" width="8" height="22" rx="4.0" fill="#1C6DD0" transform="rotate(90 80 830)"/><text x="100" y="836" font-size="14" fill="#5B6478">from Dad</text>
<rect x="196.0" y="819.0" width="8" height="22" rx="4.0" fill="#D6336C" transform="rotate(90 200 830)"/><text x="220" y="836" font-size="14" fill="#5B6478">from Mum</text>
<text x="320" y="836" font-size="14" fill="#5B6478">This model cell has 4 chromosomes (2 pairs). A human body cell has 46 (23 pairs).</text>
<rect x="56" y="860" width="968" height="296" rx="16" fill="#fff" stroke="#EADFCB"/><text x="84" y="898" font-size="20" fill="#14213D" font-weight="800">Fertilisation puts the number back</text>

<circle cx="610" cy="990" r="58" fill="#FFF0F6" stroke="#D6336C" stroke-width="3"/>
<text x="610" y="996" font-size="18" fill="#D6336C" font-weight="800" text-anchor="middle">egg</text>
<text x="610" y="1074" font-size="16" fill="#14213D" font-weight="700" text-anchor="middle">egg: n = 23</text>
<text x="250" y="1074" font-size="16" fill="#14213D" font-weight="700" text-anchor="middle">sperm: n = 23</text>
<g><ellipse cx="0" cy="0" rx="15" ry="10" fill="#1C6DD0"/><path fill="none" stroke="#1C6DD0" stroke-width="3" stroke-linecap="round" d="M-14,0 C-30,-10 -40,10 -56,0 S-80,-10 -92,0"><animate attributeName="d" dur="0.5s" repeatCount="indefinite" values="M-14,0 C-30,-10 -40,10 -56,0 S-80,-10 -92,0;M-14,0 C-30,10 -40,-10 -56,0 S-80,10 -92,0;M-14,0 C-30,-10 -40,10 -56,0 S-80,-10 -92,0"/></path><animateMotion dur="9s" repeatCount="indefinite" keyTimes="0;0.5;1" keyPoints="0;1;1" calcMode="linear" path="M220,990 C330,950 420,1030 545,990"/></g>
<text x="408" y="1074" font-size="30" fill="#14213D" font-weight="800" text-anchor="middle">+</text>
<line x1="684" y1="990" x2="756.0" y2="990.0" stroke="#14213D" stroke-width="3"/><polygon points="770,990 756.0,983.0 756.0,997.0" fill="#14213D"/>
<circle cx="850" cy="990" r="62" fill="#EBFBEE" stroke="#2F9E44" stroke-width="3"/>
<text x="850" y="988" font-size="18" fill="#2F9E44" font-weight="800" text-anchor="middle">zygote</text>
<text x="850" y="1012" font-size="22" fill="#14213D" font-weight="800" text-anchor="middle">46</text>
<text x="850" y="1074" font-size="16" fill="#14213D" font-weight="700" text-anchor="middle">zygote: 2n = 46</text>
<text x="84" y="1110" font-size="16" fill="#5B6478"><tspan x="84" dy="0">Without meiosis the zygote would get 46 + 46 = 92, and the number would double every generation. Other</tspan><tspan x="84" dy="24">animals work the same way: cat 38 → gametes 19, horse 64 → 32, chimpanzee 48 → 24.</tspan></text>
</svg>
