<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1300" viewBox="0 0 1080 1300" font-family="Montserrat,Helvetica,Arial,DejaVu Sans,sans-serif">
<rect width="1080" height="1300" fill="#FBF5E9"/><rect width="14" height="1300" fill="#2F9E44"/>
<text x="56" y="62" font-size="20" fill="#2F9E44" font-weight="700" letter-spacing="2">HUMAN BIOLOGY · PREGNANCY</text>
<text x="56" y="108" font-size="40" fill="#14213D" font-weight="800">Mother and Fetus</text>
<text x="56" y="136" font-size="20" fill="#5B6478">What Mum eats, drinks, smokes or takes reaches the baby through the placenta.</text>

<rect x="56" y="166" width="968" height="640" rx="16" fill="#fff" stroke="#EADFCB"/><text x="84" y="204" font-size="20" fill="#14213D" font-weight="800">Inside the uterus (womb)</text>

<ellipse cx="330" cy="470" rx="225" ry="245" fill="#FFC9C9" stroke="#C92A2A" stroke-width="3"/>
<ellipse cx="330" cy="475" rx="190" ry="210" fill="#E7F5FF" stroke="#74C0FC" stroke-width="2"/>
<ellipse cx="448" cy="322" rx="42" ry="78" fill="#A61E4D" transform="rotate(40 448 322)"/>
<path d="M428,292 q8,6 0,14" stroke="#F783AC" stroke-width="2" fill="none"/>
<path d="M438,304 q8,6 0,14" stroke="#F783AC" stroke-width="2" fill="none"/>
<path d="M448,316 q8,6 0,14" stroke="#F783AC" stroke-width="2" fill="none"/>
<path d="M458,328 q8,6 0,14" stroke="#F783AC" stroke-width="2" fill="none"/>
<path d="M468,340 q8,6 0,14" stroke="#F783AC" stroke-width="2" fill="none"/>
<path d="M640,214 C590,230 540,250 478,300" stroke="#C92A2A" stroke-width="16" fill="none" stroke-linecap="round"/>
<ellipse cx="310" cy="520" rx="78" ry="98" fill="#FFD8A8" stroke="#D9480F" stroke-width="2" transform="rotate(-18 310 520)"/>
<circle cx="270" cy="400" r="66" fill="#FFD8A8" stroke="#D9480F" stroke-width="2"/>
<circle cx="245" cy="390" r="5" fill="#14213D"/>
<path d="M238,418 q8,6 16,0" stroke="#D9480F" stroke-width="2" fill="none"/>
<path d="M290,480 q-60,20 -70,-20" stroke="#FFC078" stroke-width="22" fill="none" stroke-linecap="round"/>
<path d="M350,580 q-40,50 -110,30" stroke="#FFC078" stroke-width="26" fill="none" stroke-linecap="round"/>
<path d="M428,352 C458,442 420,480 340,520" stroke="#E64980" stroke-width="14" fill="none" stroke-linecap="round"/>
<path d="M428,352 C458,442 420,480 340,520" stroke="#FCC2D7" stroke-width="4" fill="none" stroke-dasharray="4 10"/>
<g><circle r="7" fill="#2F9E44" stroke="#fff" stroke-width="1.5"/><animateMotion dur="6s" begin="0.00s" repeatCount="indefinite" path="M640,214 C590,230 540,250 478,300 L428,352 C458,442 420,480 340,520"/></g><g><circle r="7" fill="#2F9E44" stroke="#fff" stroke-width="1.5"/><animateMotion dur="6s" begin="-1.20s" repeatCount="indefinite" path="M640,214 C590,230 540,250 478,300 L428,352 C458,442 420,480 340,520"/></g><g><circle r="7" fill="#2F9E44" stroke="#fff" stroke-width="1.5"/><animateMotion dur="6s" begin="-2.40s" repeatCount="indefinite" path="M640,214 C590,230 540,250 478,300 L428,352 C458,442 420,480 340,520"/></g><g><circle r="7" fill="#2F9E44" stroke="#fff" stroke-width="1.5"/><animateMotion dur="6s" begin="-3.60s" repeatCount="indefinite" path="M640,214 C590,230 540,250 478,300 L428,352 C458,442 420,480 340,520"/></g><g><circle r="7" fill="#2F9E44" stroke="#fff" stroke-width="1.5"/><animateMotion dur="6s" begin="-4.80s" repeatCount="indefinite" path="M640,214 C590,230 540,250 478,300 L428,352 C458,442 420,480 340,520"/></g>
<g><circle r="6" fill="#868E96" stroke="#fff" stroke-width="1.5"/><animateMotion dur="6s" begin="0.00s" repeatCount="indefinite" path="M340,520 C420,480 458,442 428,352 L478,300 C540,250 590,230 640,214"/></g><g><circle r="6" fill="#868E96" stroke="#fff" stroke-width="1.5"/><animateMotion dur="6s" begin="-1.50s" repeatCount="indefinite" path="M340,520 C420,480 458,442 428,352 L478,300 C540,250 590,230 640,214"/></g><g><circle r="6" fill="#868E96" stroke="#fff" stroke-width="1.5"/><animateMotion dur="6s" begin="-3.00s" repeatCount="indefinite" path="M340,520 C420,480 458,442 428,352 L478,300 C540,250 590,230 640,214"/></g><g><circle r="6" fill="#868E96" stroke="#fff" stroke-width="1.5"/><animateMotion dur="6s" begin="-4.50s" repeatCount="indefinite" path="M340,520 C420,480 458,442 428,352 L478,300 C540,250 590,230 640,214"/></g>
<g><g><circle r="8" fill="#E03131" stroke="#fff" stroke-width="1.5"/><path d="M-3.5,-3.5 L3.5,3.5 M3.5,-3.5 L-3.5,3.5" stroke="#fff" stroke-width="2"/></g><animateMotion dur="6s" begin="-0.60s" repeatCount="indefinite" path="M640,214 C590,230 540,250 478,300 L428,352 C458,442 420,480 340,520"/></g><g><g><circle r="8" fill="#E03131" stroke="#fff" stroke-width="1.5"/><path d="M-3.5,-3.5 L3.5,3.5 M3.5,-3.5 L-3.5,3.5" stroke="#fff" stroke-width="2"/></g><animateMotion dur="6s" begin="-3.60s" repeatCount="indefinite" path="M640,214 C590,230 540,250 478,300 L428,352 C458,442 420,480 340,520"/></g>
<line x1="470" y1="312" x2="600" y2="300" stroke="#5B6478" stroke-width="1.5"/><circle cx="470" cy="312" r="3.5" fill="#5B6478"/><text x="606" y="305" font-size="16" fill="#14213D" font-weight="800">placenta</text>
<line x1="430" y1="440" x2="600" y2="380" stroke="#5B6478" stroke-width="1.5"/><circle cx="430" cy="440" r="3.5" fill="#5B6478"/><text x="606" y="385" font-size="16" fill="#14213D" font-weight="800">umbilical cord</text>
<line x1="330" y1="560" x2="600" y2="450" stroke="#5B6478" stroke-width="1.5"/><circle cx="330" cy="560" r="3.5" fill="#5B6478"/><text x="606" y="455" font-size="16" fill="#14213D" font-weight="800">fetus</text>
<line x1="450" y1="620" x2="600" y2="520" stroke="#5B6478" stroke-width="1.5"/><circle cx="450" cy="620" r="3.5" fill="#5B6478"/><text x="606" y="525" font-size="16" fill="#14213D" font-weight="800">amniotic fluid</text>
<line x1="490" y1="675" x2="600" y2="590" stroke="#5B6478" stroke-width="1.5"/><circle cx="490" cy="675" r="3.5" fill="#5B6478"/><text x="606" y="595" font-size="16" fill="#14213D" font-weight="800">uterus wall (muscle)</text>
<text x="650" y="222" font-size="15" fill="#C92A2A" font-weight="800">Mum's blood</text>
<line x1="600" y1="630" x2="1000" y2="630" stroke="#EADFCB" stroke-width="2"/>
<circle cx="608" cy="656" r="7" fill="#2F9E44"/><text x="624" y="662" font-size="15" fill="#14213D" font-weight="700">oxygen and food → to the fetus</text>
<circle cx="608" cy="688" r="6" fill="#868E96"/><text x="624" y="694" font-size="15" fill="#14213D" font-weight="700">carbon dioxide and waste → back to Mum</text>
<circle cx="608" cy="720" r="8" fill="#E03131"/><path d="M604.5,716.5 L611.5,723.5 M611.5,716.5 L604.5,723.5" stroke="#fff" stroke-width="2"/><text x="624" y="726" font-size="15" fill="#C92A2A" font-weight="700">harmful things get through too:</text>
<text x="624" y="748" font-size="15" fill="#5B6478">nicotine, carbon monoxide, alcohol, drugs</text>
<text x="624" y="770" font-size="15" fill="#5B6478">and listeria bacteria</text>
<text x="84" y="790" font-size="14" fill="#5B6478">The fetus grows in the uterus for about 9 months. Mum's blood and the baby's blood never mix: things pass across in the placenta.</text>
<rect x="56.0" y="830" width="307" height="446" rx="16" fill="#fff" stroke="#EADFCB"/>

<rect x="56.0" y="830" width="307" height="10" rx="5" fill="#2F9E44"/>
<text x="80.0" y="880" font-size="24" fill="#2F9E44" font-weight="800">Diet</text>
<circle cx="86.0" cy="913" r="4" fill="#2F9E44"/>
<text x="100.0" y="918" font-size="15" fill="#14213D"><tspan x="100.0" dy="0">Eat a balanced diet:</tspan><tspan x="100.0" dy="21">protein, vitamins and</tspan><tspan x="100.0" dy="21">minerals such as iron and</tspan><tspan x="100.0" dy="21">calcium.</tspan></text>
<circle cx="86.0" cy="1011" r="4" fill="#2F9E44"/>
<text x="100.0" y="1016" font-size="15" fill="#14213D"><tspan x="100.0" dy="0">Poor diet: the fetus grows</tspan><tspan x="100.0" dy="21">slowly; the baby is born</tspan><tspan x="100.0" dy="21">small and less able to fight</tspan><tspan x="100.0" dy="21">disease.</tspan></text>
<circle cx="86.0" cy="1109" r="4" fill="#2F9E44"/>
<text x="100.0" y="1114" font-size="15" fill="#14213D"><tspan x="100.0" dy="0">Avoid soft cheese</tspan><tspan x="100.0" dy="21">(Camembert, Brie): it can</tspan><tspan x="100.0" dy="21">carry listeria, which can</tspan><tspan x="100.0" dy="21">kill a fetus.</tspan></text>
<circle cx="86.0" cy="1207" r="4" fill="#2F9E44"/>
<text x="100.0" y="1212" font-size="15" fill="#14213D"><tspan x="100.0" dy="0">Less caffeine (coffee, tea,</tspan><tspan x="100.0" dy="21">chocolate): it can slow</tspan><tspan x="100.0" dy="21">growth.</tspan></text>
<rect x="386.5" y="830" width="307" height="446" rx="16" fill="#fff" stroke="#EADFCB"/>

<rect x="386.5" y="830" width="307" height="10" rx="5" fill="#495057"/>
<text x="410.5" y="880" font-size="24" fill="#495057" font-weight="800">Smoking</text>
<circle cx="416.5" cy="913" r="4" fill="#495057"/>
<text x="430.5" y="918" font-size="15" fill="#14213D"><tspan x="430.5" dy="0">Carbon monoxide takes the</tspan><tspan x="430.5" dy="21">place of oxygen in the</tspan><tspan x="430.5" dy="21">blood, so the fetus gets</tspan><tspan x="430.5" dy="21">less oxygen.</tspan></text>
<circle cx="416.5" cy="1011" r="4" fill="#495057"/>
<text x="430.5" y="1016" font-size="15" fill="#14213D"><tspan x="430.5" dy="0">Its heart beats faster to</tspan><tspan x="430.5" dy="21">get more oxygen to its</tspan><tspan x="430.5" dy="21">cells.</tspan></text>
<circle cx="416.5" cy="1088" r="4" fill="#495057"/>
<text x="430.5" y="1093" font-size="15" fill="#14213D"><tspan x="430.5" dy="0">Risks: born early</tspan><tspan x="430.5" dy="21">(premature), low birth</tspan><tspan x="430.5" dy="21">weight, stillbirth.</tspan></text>
<rect x="717.0" y="830" width="307" height="446" rx="16" fill="#fff" stroke="#EADFCB"/>

<rect x="717.0" y="830" width="307" height="10" rx="5" fill="#C92A2A"/>
<text x="741.0" y="880" font-size="24" fill="#C92A2A" font-weight="800">Alcohol &amp; drugs</text>
<circle cx="747.0" cy="913" r="4" fill="#C92A2A"/>
<text x="761.0" y="918" font-size="15" fill="#14213D"><tspan x="761.0" dy="0">Alcohol crosses the placenta</tspan><tspan x="761.0" dy="21">into the fetus's blood.</tspan></text>
<circle cx="747.0" cy="969" r="4" fill="#C92A2A"/>
<text x="761.0" y="974" font-size="15" fill="#14213D"><tspan x="761.0" dy="0">Heavy drinking: fetal</tspan><tspan x="761.0" dy="21">alcohol syndrome (small</tspan><tspan x="761.0" dy="21">head, smooth upper lip,</tspan><tspan x="761.0" dy="21">small eye openings, learning</tspan><tspan x="761.0" dy="21">problems).</tspan></text>
<circle cx="747.0" cy="1088" r="4" fill="#C92A2A"/>
<text x="761.0" y="1093" font-size="15" fill="#14213D"><tspan x="761.0" dy="0">Drugs such as heroin: the</tspan><tspan x="761.0" dy="21">baby can be born addicted.</tspan></text>
</svg>
