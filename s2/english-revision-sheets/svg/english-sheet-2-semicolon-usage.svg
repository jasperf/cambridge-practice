<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1530" viewBox="0 0 1080 1530" font-family="Montserrat,Helvetica,Arial,DejaVu Sans,sans-serif">
<rect width="1080" height="1530" fill="#FBF5E9"/><rect width="14" height="1530" fill="#E8590C"/>
<text x="56" y="62" font-size="20" font-weight="700" fill="#E8590C" letter-spacing="2">SECONDARY 2 ENGLISH · REVISION SHEET</text>
<text x="56" y="108" font-size="40" font-weight="800" fill="#14213D">Semicolon Usage</text>
<text x="56" y="136" font-size="20" font-weight="400" fill="#5B6478">Compound sentences · conjunctive adverbs (MOTH)</text>
<text x="56" y="188" font-size="24" font-weight="800" fill="#14213D">Three ways to join two independent clauses</text>
<rect x="56" y="208" width="968" height="118" rx="16" fill="#fff" stroke="#EADFCB"/>
<circle cx="92" cy="244" r="16" fill="#14213D"/>
<text x="92" y="250" font-size="17" font-weight="800" fill="#fff" text-anchor="middle">1</text>
<text x="122" y="250" font-size="22" font-weight="800" fill="#14213D">Comma + FANBOYS</text>
<text x="1000" y="250" font-size="17" font-weight="700" fill="#5B6478" text-anchor="end" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">clause , FANBOYS clause</text>
<text x="84" y="296" font-size="24" font-weight="700" fill="#1C6DD0">The shelter is full, but more dogs arrive.</text>
<rect x="56" y="340" width="968" height="118" rx="16" fill="#fff" stroke="#E8590C"/>
<circle cx="92" cy="376" r="16" fill="#E8590C"/>
<text x="92" y="382" font-size="17" font-weight="800" fill="#fff" text-anchor="middle">2</text>
<text x="122" y="382" font-size="22" font-weight="800" fill="#E8590C">Semicolon alone</text>
<text x="1000" y="382" font-size="17" font-weight="700" fill="#5B6478" text-anchor="end" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">clause ; clause</text>
<text x="84" y="428" font-size="24" font-weight="700" fill="#1C6DD0">The shelter is full; every cage holds a dog.</text>
<rect x="56" y="472" width="968" height="118" rx="16" fill="#fff" stroke="#E8590C"/>
<circle cx="92" cy="508" r="16" fill="#E8590C"/>
<text x="92" y="514" font-size="17" font-weight="800" fill="#fff" text-anchor="middle">3</text>
<text x="122" y="514" font-size="22" font-weight="800" fill="#E8590C">Semicolon + conjunctive adverb</text>
<text x="1000" y="514" font-size="17" font-weight="700" fill="#5B6478" text-anchor="end" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">clause ; adverb , clause</text>
<text x="84" y="560" font-size="24" font-weight="700" fill="#1C6DD0">The shelter is full; however, more dogs arrive.</text>
<rect x="56" y="614" width="968" height="306" rx="16" fill="#fff" stroke="#EADFCB"/>
<text x="84" y="656" font-size="24" font-weight="800" fill="#14213D">MOTH: four conjunctive adverbs</text>
<text x="84" y="684" font-size="17" font-weight="400" fill="#5B6478">Semicolon before, comma after. Each has a FANBOYS twin.</text>
<rect x="84" y="704" width="210" height="100" rx="12" fill="#14213D"/>
<text x="189" y="744" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">M · Moreover</text>
<text x="189" y="772" font-size="16" font-weight="400" fill="#F5B58A" text-anchor="middle">= and  (adds)</text>
<rect x="310" y="704" width="210" height="100" rx="12" fill="#14213D"/>
<text x="415" y="744" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">O · Otherwise</text>
<text x="415" y="772" font-size="16" font-weight="400" fill="#F5B58A" text-anchor="middle">= or  (else / if not)</text>
<rect x="536" y="704" width="210" height="100" rx="12" fill="#14213D"/>
<text x="641" y="744" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">T · Therefore</text>
<text x="641" y="772" font-size="16" font-weight="400" fill="#F5B58A" text-anchor="middle">= so  (result)</text>
<rect x="762" y="704" width="210" height="100" rx="12" fill="#14213D"/>
<text x="867" y="744" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">H · However</text>
<text x="867" y="772" font-size="16" font-weight="400" fill="#F5B58A" text-anchor="middle">= but  (contrast)</text>
<text x="84" y="840" font-size="17" font-weight="800" fill="#E8590C">More linking words, by job</text>
<text x="84" y="868" font-size="17" font-weight="400" fill="#14213D">contrast: nevertheless  ·  result: consequently, hence  ·  similar: likewise  ·  time: meanwhile</text>
<text x="84" y="890" font-size="17" font-weight="400" fill="#14213D">alternative: alternatively</text>
<rect x="56" y="942" width="968" height="150" rx="16" fill="#14213D" stroke="#14213D"/>
<text x="84" y="982" font-size="22" font-weight="800" fill="#fff">Before you use a semicolon, check</text>
<text x="84" y="1018" font-size="18" font-weight="400" fill="#fff">✓  Can each side stand alone as a full sentence?</text>
<text x="84" y="1046" font-size="18" font-weight="400" fill="#fff">✓  Are the two ideas closely related?</text>
<text x="84" y="1074" font-size="18" font-weight="400" fill="#fff">✓  No capital after it (unless it is a name).</text>
<rect x="56" y="1114" width="968" height="370" rx="16" fill="#fff" stroke="#EADFCB"/>
<text x="84" y="1156" font-size="24" font-weight="800" fill="#14213D">Fix the mistake</text>
<line x1="84" x2="996" y1="1168" y2="1168" stroke="#EADFCB"/>
<text x="84" y="1194" font-size="20" font-weight="800" fill="#C92A2A">✗</text>
<text x="112" y="1194" font-size="20" font-weight="400" fill="#5B6478" text-decoration="line-through">It was late, we went home.</text>
<text x="84" y="1222" font-size="20" font-weight="800" fill="#2B8A3E">✓</text>
<text x="112" y="1222" font-size="20" font-weight="800" fill="#14213D">It was late; we went home.</text>
<text x="996" y="1222" font-size="14" font-weight="400" fill="#5B6478" text-anchor="end">Comma splice: a comma cannot join two clauses.</text>
<line x1="84" x2="996" y1="1246" y2="1246" stroke="#EADFCB"/>
<text x="84" y="1272" font-size="20" font-weight="800" fill="#C92A2A">✗</text>
<text x="112" y="1272" font-size="20" font-weight="400" fill="#5B6478" text-decoration="line-through">We stayed in; because it rained.</text>
<text x="84" y="1300" font-size="20" font-weight="800" fill="#2B8A3E">✓</text>
<text x="112" y="1300" font-size="20" font-weight="800" fill="#14213D">We stayed in because it rained.</text>
<text x="996" y="1300" font-size="14" font-weight="400" fill="#5B6478" text-anchor="end">“Because it rained” cannot stand alone.</text>
<line x1="84" x2="996" y1="1324" y2="1324" stroke="#EADFCB"/>
<text x="84" y="1350" font-size="20" font-weight="800" fill="#C92A2A">✗</text>
<text x="112" y="1350" font-size="20" font-weight="400" fill="#5B6478" text-decoration="line-through">I like maths; however I find it hard.</text>
<text x="84" y="1378" font-size="20" font-weight="800" fill="#2B8A3E">✓</text>
<text x="112" y="1378" font-size="20" font-weight="800" fill="#14213D">I like maths; however, I find it hard.</text>
<text x="996" y="1378" font-size="14" font-weight="400" fill="#5B6478" text-anchor="end">Comma after the adverb.</text>
<line x1="84" x2="996" y1="1402" y2="1402" stroke="#EADFCB"/>
<text x="84" y="1428" font-size="20" font-weight="800" fill="#C92A2A">✗</text>
<text x="112" y="1428" font-size="20" font-weight="400" fill="#5B6478" text-decoration="line-through">I like maths, however, I find it hard.</text>
<text x="84" y="1456" font-size="20" font-weight="800" fill="#2B8A3E">✓</text>
<text x="112" y="1456" font-size="20" font-weight="800" fill="#14213D">I like maths; however, I find it hard.</text>
<text x="996" y="1456" font-size="14" font-weight="400" fill="#5B6478" text-anchor="end">Semicolon before the adverb.</text>
<text x="56" y="1506" font-size="15" font-weight="400" fill="#5B6478">Built from the Term 1 English Unit 1 revision sheet · Section C</text>
</svg>