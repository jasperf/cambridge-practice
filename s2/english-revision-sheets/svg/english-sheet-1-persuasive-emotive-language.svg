<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1740" viewBox="0 0 1080 1740" font-family="Montserrat,Helvetica,Arial,DejaVu Sans,sans-serif">
<rect width="1080" height="1740" fill="#FBF5E9"/><rect width="14" height="1740" fill="#E8590C"/>
<text x="56" y="62" font-size="20" font-weight="700" fill="#E8590C" letter-spacing="2">SECONDARY 2 ENGLISH · REVISION SHEET</text>
<text x="56" y="108" font-size="40" font-weight="800" fill="#14213D">Persuasive &amp; Emotive Language</text>
<text x="56" y="136" font-size="20" font-weight="400" fill="#5B6478">Term 2 · Level 2/3 · Unit Test 1 · Wednesday 28 October</text>
<text x="56" y="186" font-size="24" font-weight="800" fill="#14213D">The 12 persuasive techniques</text>
<rect x="56" y="208" width="312" height="150" rx="14" fill="#fff" stroke="#E8590C" stroke-width="3"/>
<circle cx="86" cy="240" r="15" fill="#E8590C"/>
<text x="86" y="246" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">1</text>
<text x="110" y="246" font-size="20" font-weight="800" fill="#E8590C">Rhetorical question</text>
<text x="76" y="280" font-size="16" font-weight="400" fill="#5B6478">A question asked for effect, not</text>
<text x="76" y="301" font-size="16" font-weight="400" fill="#5B6478">an answer.</text>
<text x="76" y="332" font-size="16" font-weight="700" fill="#1C6DD0">“Who wouldn’t want clean air?”</text>
<rect x="384" y="208" width="312" height="150" rx="14" fill="#fff" stroke="#E8590C" stroke-width="3"/>
<circle cx="414" cy="240" r="15" fill="#E8590C"/>
<text x="414" y="246" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">2</text>
<text x="438" y="246" font-size="20" font-weight="800" fill="#E8590C">Emotive language</text>
<text x="404" y="280" font-size="16" font-weight="400" fill="#5B6478">Words chosen to stir up</text>
<text x="404" y="301" font-size="16" font-weight="400" fill="#5B6478">feelings.</text>
<text x="404" y="332" font-size="16" font-weight="700" fill="#1C6DD0">heartbroken, innocent, desperate</text>
<rect x="712" y="208" width="312" height="150" rx="14" fill="#fff" stroke="#EADFCB" stroke-width="1.5"/>
<circle cx="742" cy="240" r="15" fill="#14213D"/>
<text x="742" y="246" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">3</text>
<text x="766" y="246" font-size="20" font-weight="800" fill="#14213D">Direct address</text>
<text x="732" y="280" font-size="16" font-weight="400" fill="#5B6478">Speaks straight to the reader as</text>
<text x="732" y="301" font-size="16" font-weight="400" fill="#5B6478">“you”.</text>
<text x="732" y="332" font-size="16" font-weight="700" fill="#1C6DD0">“You can make the difference.”</text>
<rect x="56" y="374" width="312" height="150" rx="14" fill="#fff" stroke="#EADFCB" stroke-width="1.5"/>
<circle cx="86" cy="406" r="15" fill="#14213D"/>
<text x="86" y="412" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">4</text>
<text x="110" y="412" font-size="20" font-weight="800" fill="#14213D">Repetition</text>
<text x="76" y="446" font-size="16" font-weight="400" fill="#5B6478">A key word or idea comes back.</text>
<text x="76" y="498" font-size="16" font-weight="700" fill="#1C6DD0">“Fight for it. Fight now.”</text>
<rect x="384" y="374" width="312" height="150" rx="14" fill="#fff" stroke="#EADFCB" stroke-width="1.5"/>
<circle cx="414" cy="406" r="15" fill="#14213D"/>
<text x="414" y="412" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">5</text>
<text x="438" y="412" font-size="20" font-weight="800" fill="#14213D">Facts &amp; statistics</text>
<text x="404" y="446" font-size="16" font-weight="400" fill="#5B6478">Information and numbers you can</text>
<text x="404" y="467" font-size="16" font-weight="400" fill="#5B6478">check.</text>
<text x="404" y="498" font-size="16" font-weight="700" fill="#1C6DD0">“9 in 10 reefs are at risk.”</text>
<rect x="712" y="374" width="312" height="150" rx="14" fill="#fff" stroke="#EADFCB" stroke-width="1.5"/>
<circle cx="742" cy="406" r="15" fill="#14213D"/>
<text x="742" y="412" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">6</text>
<text x="766" y="412" font-size="20" font-weight="800" fill="#14213D">Rule of three</text>
<text x="732" y="446" font-size="16" font-weight="400" fill="#5B6478">Three related words or ideas in</text>
<text x="732" y="467" font-size="16" font-weight="400" fill="#5B6478">a row.</text>
<text x="732" y="498" font-size="16" font-weight="700" fill="#1C6DD0">“Safe, clean and affordable.”</text>
<rect x="56" y="540" width="312" height="150" rx="14" fill="#fff" stroke="#EADFCB" stroke-width="1.5"/>
<circle cx="86" cy="572" r="15" fill="#14213D"/>
<text x="86" y="578" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">7</text>
<text x="110" y="578" font-size="20" font-weight="800" fill="#14213D">Expert opinion</text>
<text x="76" y="612" font-size="16" font-weight="400" fill="#5B6478">The view of a qualified person.</text>
<text x="76" y="664" font-size="16" font-weight="700" fill="#1C6DD0">“Dr Lee, a scientist, warns…”</text>
<rect x="384" y="540" width="312" height="150" rx="14" fill="#fff" stroke="#EADFCB" stroke-width="1.5"/>
<circle cx="414" cy="572" r="15" fill="#14213D"/>
<text x="414" y="578" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">8</text>
<text x="438" y="578" font-size="20" font-weight="800" fill="#14213D">Anecdote</text>
<text x="404" y="612" font-size="16" font-weight="400" fill="#5B6478">A short, real or relatable case.</text>
<text x="404" y="664" font-size="16" font-weight="700" fill="#1C6DD0">“Last week, my brother…”</text>
<rect x="712" y="540" width="312" height="150" rx="14" fill="#fff" stroke="#EADFCB" stroke-width="1.5"/>
<circle cx="742" cy="572" r="15" fill="#14213D"/>
<text x="742" y="578" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">9</text>
<text x="766" y="578" font-size="20" font-weight="800" fill="#14213D">Inclusive language</text>
<text x="732" y="612" font-size="16" font-weight="400" fill="#5B6478">we, us and our: the writer joins</text>
<text x="732" y="633" font-size="16" font-weight="400" fill="#5B6478">the reader.</text>
<text x="732" y="664" font-size="16" font-weight="700" fill="#1C6DD0">“Together, we can fix this.”</text>
<rect x="56" y="706" width="312" height="150" rx="14" fill="#fff" stroke="#EADFCB" stroke-width="1.5"/>
<circle cx="86" cy="738" r="15" fill="#14213D"/>
<text x="86" y="744" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">10</text>
<text x="110" y="744" font-size="20" font-weight="800" fill="#14213D">Imperative verbs</text>
<text x="76" y="778" font-size="16" font-weight="400" fill="#5B6478">Command words that tell the</text>
<text x="76" y="799" font-size="16" font-weight="400" fill="#5B6478">reader to act.</text>
<text x="76" y="830" font-size="16" font-weight="700" fill="#1C6DD0">“Join us. Donate today.”</text>
<rect x="384" y="706" width="312" height="150" rx="14" fill="#fff" stroke="#EADFCB" stroke-width="1.5"/>
<circle cx="414" cy="738" r="15" fill="#14213D"/>
<text x="414" y="744" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">11</text>
<text x="438" y="744" font-size="20" font-weight="800" fill="#14213D">Concession</text>
<text x="404" y="778" font-size="16" font-weight="400" fill="#5B6478">Admits a point from the other</text>
<text x="404" y="799" font-size="16" font-weight="400" fill="#5B6478">side first.</text>
<text x="404" y="830" font-size="16" font-weight="700" fill="#1C6DD0">“Yes, it costs money, but…”</text>
<rect x="712" y="706" width="312" height="150" rx="14" fill="#fff" stroke="#EADFCB" stroke-width="1.5"/>
<circle cx="742" cy="738" r="15" fill="#14213D"/>
<text x="742" y="744" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">12</text>
<text x="766" y="744" font-size="20" font-weight="800" fill="#14213D">Juxtaposition</text>
<text x="732" y="778" font-size="16" font-weight="400" fill="#5B6478">Contrasting things placed side</text>
<text x="732" y="799" font-size="16" font-weight="400" fill="#5B6478">by side.</text>
<text x="732" y="830" font-size="16" font-weight="700" fill="#1C6DD0">“Wasted food, hungry children.”</text>
<text x="56" y="878" font-size="16" font-weight="700" fill="#E8590C">Orange outline = this week’s focus: rhetorical questioning and emotive language</text>
<rect x="56" y="908" width="968" height="300" rx="16" fill="#fff" stroke="#EADFCB"/>
<text x="84" y="950" font-size="24" font-weight="800" fill="#14213D">Emotive language: same fact, stronger feeling</text>
<text x="84" y="980" font-size="17" font-weight="400" fill="#5B6478">A word’s connotation is the feeling attached to it beyond its dictionary meaning. Name the</text>
<text x="84" y="1002" font-size="17" font-weight="400" fill="#5B6478">feeling it creates in the reader.</text>
<text x="84" y="1046" font-size="14" font-weight="700" fill="#E8590C" letter-spacing="1.5">NEUTRAL WORD</text>
<text x="330" y="1046" font-size="14" font-weight="700" fill="#E8590C" letter-spacing="1.5">EMOTIVE WORD</text>
<text x="600" y="1046" font-size="14" font-weight="700" fill="#E8590C" letter-spacing="1.5">FEELING CREATED</text>
<line x1="84" x2="990" y1="1054" y2="1054" stroke="#EADFCB"/>
<text x="84" y="1080" font-size="20" font-weight="400" fill="#5B6478">kept in cages</text>
<text x="330" y="1080" font-size="20" font-weight="800" fill="#14213D">trapped in cages</text>
<text x="600" y="1080" font-size="20" font-weight="800" fill="#1C6DD0">→  sympathy</text>
<line x1="84" x2="990" y1="1092" y2="1092" stroke="#EADFCB"/>
<text x="84" y="1118" font-size="20" font-weight="400" fill="#5B6478">ignored</text>
<text x="330" y="1118" font-size="20" font-weight="800" fill="#14213D">abandoned</text>
<text x="600" y="1118" font-size="20" font-weight="800" fill="#1C6DD0">→  guilt</text>
<line x1="84" x2="990" y1="1130" y2="1130" stroke="#EADFCB"/>
<text x="84" y="1156" font-size="20" font-weight="400" fill="#5B6478">a problem</text>
<text x="330" y="1156" font-size="20" font-weight="800" fill="#14213D">a crisis</text>
<text x="600" y="1156" font-size="20" font-weight="800" fill="#1C6DD0">→  urgency</text>
<line x1="84" x2="990" y1="1168" y2="1168" stroke="#EADFCB"/>
<text x="84" y="1194" font-size="20" font-weight="400" fill="#5B6478">unfair</text>
<text x="330" y="1194" font-size="20" font-weight="800" fill="#14213D">outrageous</text>
<text x="600" y="1194" font-size="20" font-weight="800" fill="#1C6DD0">→  anger</text>
<rect x="56" y="1232" width="968" height="170" rx="16" fill="#fff" stroke="#EADFCB"/>
<text x="84" y="1274" font-size="24" font-weight="800" fill="#14213D">Rhetorical question: the effect</text>
<text x="84" y="1312" font-size="22" font-weight="800" fill="#1C6DD0">“Will you turn your back on them?”</text>
<text x="84" y="1344" font-size="17" font-weight="400" fill="#5B6478">No answer is expected. It makes the reader think, feel involved and agree with the obvious</text>
<text x="84" y="1366" font-size="17" font-weight="400" fill="#5B6478">answer, often feeling guilty or pressured to act.</text>
<rect x="56" y="1426" width="968" height="250" rx="16" fill="#14213D"/>
<text x="84" y="1468" font-size="22" font-weight="800" fill="#fff">How to write an answer: Technique – Evidence – Purpose – Effect</text>
<rect x="84" y="1490" width="214" height="58" rx="10" fill="#E8590C"/>
<text x="191" y="1517" font-size="19" font-weight="800" fill="#fff" text-anchor="middle">T · Technique</text>
<text x="191" y="1538" font-size="14" font-weight="400" fill="#fff" text-anchor="middle">name it</text>
<rect x="310" y="1490" width="214" height="58" rx="10" fill="#E8590C"/>
<text x="417" y="1517" font-size="19" font-weight="800" fill="#fff" text-anchor="middle">E · Evidence</text>
<text x="417" y="1538" font-size="14" font-weight="400" fill="#fff" text-anchor="middle">quote it</text>
<rect x="536" y="1490" width="214" height="58" rx="10" fill="#E8590C"/>
<text x="643" y="1517" font-size="19" font-weight="800" fill="#fff" text-anchor="middle">P · Purpose</text>
<text x="643" y="1538" font-size="14" font-weight="400" fill="#fff" text-anchor="middle">why the writer used it</text>
<rect x="762" y="1490" width="214" height="58" rx="10" fill="#E8590C"/>
<text x="869" y="1517" font-size="19" font-weight="800" fill="#fff" text-anchor="middle">E · Effect</text>
<text x="869" y="1538" font-size="14" font-weight="400" fill="#fff" text-anchor="middle">what the reader feels</text>
<text x="84" y="1584" font-size="17" font-weight="400" fill="#fff">Model: The writer uses a rhetorical question, “Will you turn your back on them?”, to</text>
<text x="84" y="1608" font-size="17" font-weight="400" fill="#fff">pressure the reader into helping. This makes the reader feel guilty and want to act.</text>
<text x="84" y="1658" font-size="17" font-weight="700" fill="#F5B58A">Identify it · Quote it · Explain its effect</text>
<text x="56" y="1716" font-size="15" font-weight="400" fill="#5B6478">Built from the Week 3 English Unit Test 1 practice sheet · Ms. Atiya’s Persuasive Techniques posters</text>
</svg>