<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="700" viewBox="0 0 1080 700" font-family="Montserrat,Helvetica,Arial,DejaVu Sans,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E8590C"/></marker>
<marker id="n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14213D"/></marker></defs>
<rect width="1080" height="700" fill="#FBF5E9"/><rect width="14" height="700" fill="#E8590C"/>
<text x="56" y="62" font-size="20" font-weight="700" fill="#E8590C" letter-spacing="2">SECONDARY 2 SCIENCE · DIAGRAM</text>
<text x="56" y="108" font-size="40" font-weight="800" fill="#14213D">Formula Triangles</text>
<text x="56" y="136" font-size="20" fill="#5B6478">Cover the quantity you want, then read off the formula</text>
<rect x="56" y="170" width="300" height="470" rx="16" fill="#fff" stroke="#EADFCB"/><text x="206.0" y="212" font-size="24" font-weight="800" fill="#E8590C" text-anchor="middle">Density</text><polygon points="206.0,240 81.0,400 331.0,400" fill="#FBF5E9" stroke="#14213D" stroke-width="4" stroke-linejoin="round"/><line x1="143.5" x2="268.5" y1="320" y2="320" stroke="#14213D" stroke-width="4"/><line x1="206.0" x2="206.0" y1="320" y2="400" stroke="#14213D" stroke-width="4"/><text x="206.0" y="306" font-size="40" font-weight="800" fill="#1C6DD0" text-anchor="middle">m</text><text x="156.0" y="374" font-size="40" font-weight="800" fill="#1C6DD0" text-anchor="middle">ρ</text><text x="256.0" y="374" font-size="40" font-weight="800" fill="#1C6DD0" text-anchor="middle">V</text><text x="206.0" y="470" font-size="26" font-weight="700" fill="#14213D" text-anchor="middle" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">ρ = m ÷ V</text><text x="206.0" y="508" font-size="26" font-weight="700" fill="#14213D" text-anchor="middle" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">m = ρ × V</text><text x="206.0" y="546" font-size="26" font-weight="700" fill="#14213D" text-anchor="middle" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">V = m ÷ ρ</text><text x="206.0" y="610" font-size="16" fill="#5B6478" text-anchor="middle">g · cm³ · g/cm³</text><rect x="380" y="170" width="300" height="470" rx="16" fill="#fff" stroke="#EADFCB"/><text x="530.0" y="212" font-size="24" font-weight="800" fill="#E8590C" text-anchor="middle">Ohm's law</text><polygon points="530.0,240 405.0,400 655.0,400" fill="#FBF5E9" stroke="#14213D" stroke-width="4" stroke-linejoin="round"/><line x1="467.5" x2="592.5" y1="320" y2="320" stroke="#14213D" stroke-width="4"/><line x1="530.0" x2="530.0" y1="320" y2="400" stroke="#14213D" stroke-width="4"/><text x="530.0" y="306" font-size="40" font-weight="800" fill="#1C6DD0" text-anchor="middle">V</text><text x="480.0" y="374" font-size="40" font-weight="800" fill="#1C6DD0" text-anchor="middle">I</text><text x="580.0" y="374" font-size="40" font-weight="800" fill="#1C6DD0" text-anchor="middle">R</text><text x="530.0" y="470" font-size="26" font-weight="700" fill="#14213D" text-anchor="middle" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">V = I × R</text><text x="530.0" y="508" font-size="26" font-weight="700" fill="#14213D" text-anchor="middle" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">I = V ÷ R</text><text x="530.0" y="546" font-size="26" font-weight="700" fill="#14213D" text-anchor="middle" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">R = V ÷ I</text><text x="530.0" y="610" font-size="16" fill="#5B6478" text-anchor="middle">volts · amperes · ohms</text><rect x="704" y="170" width="316" height="470" rx="16" fill="#14213D"/><text x="862.0" y="212" font-size="24" font-weight="800" fill="#FFB27A" text-anchor="middle">Waves</text><text x="862.0" y="320" font-size="60" font-weight="800" fill="#fff" text-anchor="middle">T ⇄ f</text><text x="862.0" y="420" font-size="28" font-weight="700" fill="#fff" text-anchor="middle" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">T = 1 ÷ f</text><text x="862.0" y="464" font-size="28" font-weight="700" fill="#fff" text-anchor="middle" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">f = 1 ÷ T</text><text x="862.0" y="540" font-size="17" fill="#EADFCB" text-anchor="middle">flip it: period and</text><text x="862.0" y="564" font-size="17" fill="#EADFCB" text-anchor="middle">frequency are inverses</text><text x="862.0" y="610" font-size="16" fill="#EADFCB" text-anchor="middle">seconds · hertz</text><text x="56" y="670" font-size="16" fill="#5B6478">Tip: top = the quantity made from the other two multiplied together. Cover your target, then read what is left.</text></svg>