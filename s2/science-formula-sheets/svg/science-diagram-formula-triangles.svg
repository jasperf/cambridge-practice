<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="800" viewBox="0 0 1080 800" font-family="Montserrat,Helvetica,Arial,DejaVu Sans,sans-serif">
<rect width="1080" height="800" fill="#FBF5E9"/><rect width="14" height="800" fill="#E8590C"/>
<text x="56" y="62" font-size="20" font-weight="700" fill="#E8590C" letter-spacing="2">SECONDARY 2 SCIENCE · TEST DAY</text>
<text x="56" y="108" font-size="40" font-weight="800" fill="#14213D">Formula Triangles</text>
<text x="56" y="136" font-size="20" fill="#5B6478">Density · frequency · volts: cover the quantity you want, read off the rest</text>
<rect x="56" y="170" width="308" height="560" rx="16" fill="#fff" stroke="#EADFCB"/>
<text x="210.0" y="212" font-size="24" font-weight="800" fill="#E8590C" text-anchor="middle">Density</text>
<polygon points="210.0,240 85.0,400 335.0,400" fill="#FBF5E9" stroke="#14213D" stroke-width="4" stroke-linejoin="round"/>
<line x1="147.5" x2="272.5" y1="320" y2="320" stroke="#14213D" stroke-width="4"/><line x1="210.0" x2="210.0" y1="320" y2="400" stroke="#14213D" stroke-width="4"/>
<text x="210.0" y="306" font-size="40" font-weight="800" fill="#1C6DD0" text-anchor="middle">m</text>
<text x="160.0" y="374" font-size="40" font-weight="800" fill="#1C6DD0" text-anchor="middle">ρ</text>
<text x="260.0" y="374" font-size="40" font-weight="800" fill="#1C6DD0" text-anchor="middle">V</text>
<text x="210.0" y="460" font-size="26" font-weight="700" fill="#14213D" text-anchor="middle" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">ρ = m ÷ V</text>
<text x="210.0" y="498" font-size="26" font-weight="700" fill="#14213D" text-anchor="middle" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">m = ρ × V</text>
<text x="210.0" y="536" font-size="26" font-weight="700" fill="#14213D" text-anchor="middle" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">V = m ÷ ρ</text>
<text x="210.0" y="582" font-size="16" fill="#5B6478" text-anchor="middle">g · cm³ · g/cm³</text>
<rect x="76" y="604" width="268" height="104" rx="10" fill="#FBF5E9"/>
<text x="210.0" y="634" font-size="18" font-weight="400" fill="#14213D" text-anchor="middle">Example: m = 120 g,</text>
<text x="210.0" y="664" font-size="18" font-weight="400" fill="#14213D" text-anchor="middle">V = 40 cm³</text>
<text x="210.0" y="694" font-size="18" font-weight="700" fill="#14213D" text-anchor="middle">ρ = 120 ÷ 40 = 3 g/cm³</text>
<rect x="386" y="170" width="308" height="560" rx="16" fill="#14213D"/>
<text x="540" y="212" font-size="24" font-weight="800" fill="#FFB27A" text-anchor="middle">Frequency &amp; period</text>
<text x="540" y="340" font-size="64" font-weight="800" fill="#fff" text-anchor="middle">T ⇄ f</text>
<text x="540" y="460" font-size="28" font-weight="700" fill="#fff" text-anchor="middle" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">T = 1 ÷ f</text>
<text x="540" y="506" font-size="28" font-weight="700" fill="#fff" text-anchor="middle" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">f = 1 ÷ T</text>
<text x="540" y="552" font-size="17" fill="#EADFCB" text-anchor="middle">flip it: period and</text>
<text x="540" y="576" font-size="17" fill="#EADFCB" text-anchor="middle">frequency are inverses</text>
<rect x="406" y="604" width="268" height="104" rx="10" fill="#1F3159"/>
<text x="540" y="634" font-size="18" fill="#fff" text-anchor="middle">Example: T = 0.25 s</text>
<text x="540" y="664" font-size="18" fill="#fff" text-anchor="middle">f = 1 ÷ 0.25</text>
<text x="540" y="694" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">f = 4 Hz</text>
<rect x="716" y="170" width="308" height="560" rx="16" fill="#fff" stroke="#EADFCB"/>
<text x="870.0" y="212" font-size="24" font-weight="800" fill="#E8590C" text-anchor="middle">Ohm's law (volts)</text>
<polygon points="870.0,240 745.0,400 995.0,400" fill="#FBF5E9" stroke="#14213D" stroke-width="4" stroke-linejoin="round"/>
<line x1="807.5" x2="932.5" y1="320" y2="320" stroke="#14213D" stroke-width="4"/><line x1="870.0" x2="870.0" y1="320" y2="400" stroke="#14213D" stroke-width="4"/>
<text x="870.0" y="306" font-size="40" font-weight="800" fill="#1C6DD0" text-anchor="middle">V</text>
<text x="820.0" y="374" font-size="40" font-weight="800" fill="#1C6DD0" text-anchor="middle">I</text>
<text x="920.0" y="374" font-size="40" font-weight="800" fill="#1C6DD0" text-anchor="middle">R</text>
<text x="870.0" y="460" font-size="26" font-weight="700" fill="#14213D" text-anchor="middle" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">V = I × R</text>
<text x="870.0" y="498" font-size="26" font-weight="700" fill="#14213D" text-anchor="middle" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">I = V ÷ R</text>
<text x="870.0" y="536" font-size="26" font-weight="700" fill="#14213D" text-anchor="middle" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">R = V ÷ I</text>
<text x="870.0" y="582" font-size="16" fill="#5B6478" text-anchor="middle">volts · amperes · ohms</text>
<rect x="736" y="604" width="268" height="104" rx="10" fill="#FBF5E9"/>
<text x="870.0" y="634" font-size="18" font-weight="400" fill="#14213D" text-anchor="middle">Example: V = 12 V,</text>
<text x="870.0" y="664" font-size="18" font-weight="400" fill="#14213D" text-anchor="middle">I = 3 A</text>
<text x="870.0" y="694" font-size="18" font-weight="700" fill="#14213D" text-anchor="middle">R = 12 ÷ 3 = 4 Ω</text>
<text x="56" y="772" font-size="16" fill="#5B6478">Tip: top = the other two multiplied together. Cover your target; side by side = multiply, over/under = divide.</text></svg>