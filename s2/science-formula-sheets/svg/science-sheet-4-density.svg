<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1260" viewBox="0 0 1080 1260" font-family="Montserrat,Helvetica,Arial,DejaVu Sans,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="1080" height="1260" fill="#FBF5E9"/>
<rect x="0" y="0" width="14" height="1260" fill="#E8590C"/>
<text x="56" y="62" font-size="20" font-weight="700" fill="#E8590C" letter-spacing="2">SECONDARY 2 SCIENCE · SHEET 4 OF 6</text>
<text x="56" y="108" font-size="40" font-weight="800" fill="#14213D">Density</text>
<text x="56" y="136" font-size="20" fill="#5B6478">Term 2 · Unit 3</text>
<text x="56" y="172" font-size="24" font-weight="800" fill="#E8590C">Formula triangle (m on top; ρ and V below)</text>
<rect x="56" y="176" width="968" height="0" />
<rect x="56" y="190" width="968" height="162" rx="16" fill="#fff" stroke="#EADFCB"/>
<text x="80" y="230" font-size="21" font-weight="700" fill="#14213D"><tspan x="80" dy="0">Density</tspan></text>
<text x="410" y="230" font-size="21" fill="#14213D" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace"><tspan x="410" dy="0">ρ = m ÷ V   (g/cm³)</tspan></text>
<line x1="80" x2="1000" y1="246" y2="246" stroke="#EADFCB"/>
<text x="80" y="276" font-size="21" font-weight="700" fill="#14213D"><tspan x="80" dy="0">Mass</tspan></text>
<text x="410" y="276" font-size="21" fill="#14213D" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace"><tspan x="410" dy="0">m = ρ × V   (g)</tspan></text>
<line x1="80" x2="1000" y1="292" y2="292" stroke="#EADFCB"/>
<text x="80" y="322" font-size="21" font-weight="700" fill="#14213D"><tspan x="80" dy="0">Volume</tspan></text>
<text x="410" y="322" font-size="21" fill="#14213D" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace"><tspan x="410" dy="0">V = m ÷ ρ   (cm³)</tspan></text>
<text x="56" y="408" font-size="24" font-weight="800" fill="#E8590C">Finding volume</text>
<rect x="56" y="412" width="968" height="0" />
<rect x="56" y="426" width="968" height="192" rx="16" fill="#fff" stroke="#EADFCB"/>
<text x="80" y="466" font-size="21" font-weight="700" fill="#14213D"><tspan x="80" dy="0">Cuboid</tspan></text>
<text x="410" y="466" font-size="21" fill="#14213D" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace"><tspan x="410" dy="0">V = length × width × height</tspan></text>
<line x1="80" x2="1000" y1="482" y2="482" stroke="#EADFCB"/>
<text x="80" y="512" font-size="21" font-weight="700" fill="#14213D"><tspan x="80" dy="0">Irregular solid</tspan></text>
<text x="410" y="512" font-size="21" fill="#14213D" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace"><tspan x="410" dy="0">displacement: final level − start level</tspan></text>
<line x1="80" x2="1000" y1="528" y2="528" stroke="#EADFCB"/>
<text x="80" y="558" font-size="21" font-weight="700" fill="#14213D"><tspan x="80" dy="0">Units</tspan></text>
<text x="410" y="558" font-size="21" fill="#14213D" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace"><tspan x="410" dy="0">1 mL = 1 cm³ · 1 dm³ = 1000 cm³ · 1 g/cm³ =</tspan><tspan x="410" dy="30">1000 kg/m³</tspan></text>
<text x="56" y="674" font-size="24" font-weight="800" fill="#E8590C">Float or sink, and temperature</text>
<rect x="56" y="678" width="968" height="0" />
<rect x="56" y="692" width="968" height="162" rx="16" fill="#fff" stroke="#EADFCB"/>
<text x="80" y="732" font-size="21" font-weight="700" fill="#14213D"><tspan x="80" dy="0">Float / sink</tspan></text>
<text x="410" y="732" font-size="21" fill="#14213D" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace"><tspan x="410" dy="0">less dense than liquid floats; denser sinks</tspan></text>
<line x1="80" x2="1000" y1="748" y2="748" stroke="#EADFCB"/>
<text x="80" y="778" font-size="21" font-weight="700" fill="#14213D"><tspan x="80" dy="0">Heat</tspan></text>
<text x="410" y="778" font-size="21" fill="#14213D" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace"><tspan x="410" dy="0">particles spread out, density decreases</tspan></text>
<line x1="80" x2="1000" y1="794" y2="794" stroke="#EADFCB"/>
<text x="80" y="824" font-size="21" font-weight="700" fill="#14213D"><tspan x="80" dy="0">Cool</tspan></text>
<text x="410" y="824" font-size="21" fill="#14213D" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace"><tspan x="410" dy="0">particles closer, density increases</tspan></text>
<text x="56" y="910" font-size="24" font-weight="800" fill="#E8590C">Reference densities (g/cm³)</text>
<rect x="56" y="914" width="968" height="0" />
<rect x="56" y="928" width="968" height="238" rx="16" fill="#fff" stroke="#EADFCB"/>
<text x="80" y="968" font-size="21" font-weight="700" fill="#14213D"><tspan x="80" dy="0">Water / aluminium</tspan></text>
<text x="410" y="968" font-size="21" fill="#14213D" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace"><tspan x="410" dy="0">1 / 2.7</tspan></text>
<line x1="80" x2="1000" y1="984" y2="984" stroke="#EADFCB"/>
<text x="80" y="1014" font-size="21" font-weight="700" fill="#14213D"><tspan x="80" dy="0">Gold</tspan></text>
<text x="410" y="1014" font-size="21" fill="#14213D" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace"><tspan x="410" dy="0">19.32 solid, 17.19 molten</tspan></text>
<line x1="80" x2="1000" y1="1030" y2="1030" stroke="#EADFCB"/>
<text x="80" y="1060" font-size="21" font-weight="700" fill="#14213D"><tspan x="80" dy="0">Ice / liquid water</tspan></text>
<text x="410" y="1060" font-size="21" fill="#14213D" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace"><tspan x="410" dy="0">0.9168 / 0.9971</tspan></text>
<line x1="80" x2="1000" y1="1076" y2="1076" stroke="#EADFCB"/>
<text x="80" y="1106" font-size="21" font-weight="700" fill="#14213D"><tspan x="80" dy="0">Water vapour /</tspan><tspan x="80" dy="30">hydrogen</tspan></text>
<text x="410" y="1106" font-size="21" fill="#14213D" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace"><tspan x="410" dy="0">0.000588 / 0.000089</tspan></text>
<text x="56" y="1234" font-size="18" fill="#5B6478">Formula sheets · Jasper</text>
</svg>