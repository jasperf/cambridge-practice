<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="978" viewBox="0 0 1080 978" font-family="Montserrat,Helvetica,Arial,DejaVu Sans,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="1080" height="978" fill="#FBF5E9"/>
<rect x="0" y="0" width="14" height="978" fill="#E8590C"/>
<text x="56" y="62" font-size="20" font-weight="700" fill="#E8590C" letter-spacing="2">SECONDARY 2 SCIENCE · SHEET 1 OF 6</text>
<text x="56" y="108" font-size="40" font-weight="800" fill="#14213D">Atomic Structure &amp; Periodic Table</text>
<text x="56" y="136" font-size="20" fill="#5B6478">Term 1 · Unit 1</text>
<text x="56" y="172" font-size="24" font-weight="800" fill="#E8590C">Core formulas</text>
<rect x="56" y="176" width="968" height="0" />
<rect x="56" y="190" width="968" height="192" rx="16" fill="#fff" stroke="#EADFCB"/>
<text x="80" y="230" font-size="21" font-weight="700" fill="#14213D"><tspan x="80" dy="0">Atomic number</tspan></text>
<text x="410" y="230" font-size="21" fill="#14213D" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace"><tspan x="410" dy="0">= number of protons = number of electrons</tspan><tspan x="410" dy="30">(neutral atom)</tspan></text>
<line x1="80" x2="1000" y1="276" y2="276" stroke="#EADFCB"/>
<text x="80" y="306" font-size="21" font-weight="700" fill="#14213D"><tspan x="80" dy="0">Mass number</tspan></text>
<text x="410" y="306" font-size="21" fill="#14213D" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace"><tspan x="410" dy="0">= protons + neutrons</tspan></text>
<line x1="80" x2="1000" y1="322" y2="322" stroke="#EADFCB"/>
<text x="80" y="352" font-size="21" font-weight="700" fill="#14213D"><tspan x="80" dy="0">Neutrons</tspan></text>
<text x="410" y="352" font-size="21" fill="#14213D" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace"><tspan x="410" dy="0">= mass number − atomic number</tspan></text>
<text x="56" y="438" font-size="24" font-weight="800" fill="#E8590C">Electron shells (elements 1–20)</text>
<rect x="56" y="442" width="968" height="0" />
<rect x="56" y="456" width="968" height="162" rx="16" fill="#fff" stroke="#EADFCB"/>
<text x="80" y="496" font-size="21" font-weight="700" fill="#14213D"><tspan x="80" dy="0">Fill order</tspan></text>
<text x="410" y="496" font-size="21" fill="#14213D" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace"><tspan x="410" dy="0">2, 8, 8 from the nucleus outwards</tspan></text>
<line x1="80" x2="1000" y1="512" y2="512" stroke="#EADFCB"/>
<text x="80" y="542" font-size="21" font-weight="700" fill="#14213D"><tspan x="80" dy="0">Sodium (11)</tspan></text>
<text x="410" y="542" font-size="21" fill="#14213D" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace"><tspan x="410" dy="0">2,8,1</tspan></text>
<line x1="80" x2="1000" y1="558" y2="558" stroke="#EADFCB"/>
<text x="80" y="588" font-size="21" font-weight="700" fill="#14213D"><tspan x="80" dy="0">Chlorine (17)</tspan></text>
<text x="410" y="588" font-size="21" fill="#14213D" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace"><tspan x="410" dy="0">2,8,7</tspan></text>
<text x="56" y="674" font-size="24" font-weight="800" fill="#E8590C">Periodic table</text>
<rect x="56" y="678" width="968" height="0" />
<rect x="56" y="692" width="968" height="192" rx="16" fill="#fff" stroke="#EADFCB"/>
<text x="80" y="732" font-size="21" font-weight="700" fill="#14213D"><tspan x="80" dy="0">Group</tspan></text>
<text x="410" y="732" font-size="21" fill="#14213D" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace"><tspan x="410" dy="0">vertical column = outer electrons, similar</tspan><tspan x="410" dy="30">properties</tspan></text>
<line x1="80" x2="1000" y1="778" y2="778" stroke="#EADFCB"/>
<text x="80" y="808" font-size="21" font-weight="700" fill="#14213D"><tspan x="80" dy="0">Period</tspan></text>
<text x="410" y="808" font-size="21" fill="#14213D" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace"><tspan x="410" dy="0">horizontal row = number of shells</tspan></text>
<line x1="80" x2="1000" y1="824" y2="824" stroke="#EADFCB"/>
<text x="80" y="854" font-size="21" font-weight="700" fill="#14213D"><tspan x="80" dy="0">Group 8 (18)</tspan></text>
<text x="410" y="854" font-size="21" fill="#14213D" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace"><tspan x="410" dy="0">full outer shell: stable noble gases</tspan></text>
<text x="56" y="952" font-size="18" fill="#5B6478">Formula sheets · Jasper</text>
</svg>