<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="960" viewBox="0 0 1080 960" font-family="Montserrat,Helvetica,Arial,DejaVu Sans,sans-serif">
<rect width="1080" height="960" fill="#FBF5E9"/><rect width="14" height="960" fill="#E8590C"/>
<text x="56" y="62" font-size="20" font-weight="700" fill="#E8590C" letter-spacing="2">STEP 3 OF 3 · OHM'S LAW AT THE PHONE</text>
<text x="56" y="108" font-size="40" font-weight="800" fill="#14213D">Charging a Phone</text>
<text x="56" y="136" font-size="20" fill="#5B6478">Use V = I × R to find the phone's effective resistance</text>
<rect x="56" y="170" width="968" height="250" rx="16" fill="#fff" stroke="#EADFCB"/>
<rect x="96" y="210" width="120" height="160" rx="10" fill="#EFE8DA" stroke="#14213D" stroke-width="2"/>
<text x="156" y="398" font-size="14" fill="#5B6478" text-anchor="middle">Wall socket</text>
<rect x="176" y="250" width="130" height="90" rx="12" fill="#fff" stroke="#14213D" stroke-width="2.5"/>
<text x="241" y="292" font-size="18" font-weight="800" fill="#14213D" text-anchor="middle">Charger</text>
<text x="241" y="316" font-size="13" fill="#5B6478" text-anchor="middle">5 V DC out</text>
<rect x="302" y="288" width="12" height="16" rx="2" fill="#14213D"/>
<line x1="241" y1="230" x2="241" y2="250" stroke="#E8590C" stroke-width="2.5" stroke-dasharray="4 4"/>
<rect x="166" y="186" width="150" height="44" rx="22" fill="#E8590C"/>
<text x="241" y="216" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">V = 5 V</text>
<path d="M314 296 C 430 296, 470 380, 590 380 S 740 300, 780 296" fill="none" stroke="#14213D" stroke-width="4" stroke-linecap="round"/>
<polygon points="-11,-9 11,0 -11,9" fill="#1C6DD0" transform="translate(450.5,338) rotate(28)"/>
<polygon points="-11,-9 11,0 -11,9" fill="#1C6DD0" transform="translate(715,339.5) rotate(-36.7)"/>
<rect x="520" y="236" width="140" height="44" rx="22" fill="#1C6DD0"/>
<text x="590" y="266" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">I = 2 A</text>
<rect x="780" y="196" width="140" height="204" rx="26" fill="#14213D"/>
<rect x="792" y="208" width="116" height="180" rx="16" fill="#F2F5FB"/>
<rect x="825" y="218" width="50" height="10" rx="5" fill="#14213D"/>
<rect x="820" y="262" width="60" height="30" rx="6" fill="none" stroke="#2F9E5A" stroke-width="3"/>
<rect x="880" y="271" width="5" height="12" rx="1" fill="#2F9E5A"/>
<rect x="825" y="267" width="32" height="20" rx="3" fill="#2F9E5A"/>
<text x="850" y="324" font-size="18" font-weight="800" fill="#14213D" text-anchor="middle">Phone</text>
<text x="850" y="346" font-size="13" fill="#5B6478" text-anchor="middle">charging…</text>
<rect x="938" y="276" width="78" height="40" rx="20" fill="#2F9E5A"/>
<text x="977" y="303" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">R = ?</text>
<text x="56" y="466" font-size="24" font-weight="800" fill="#14213D">The question</text>
<text x="56" y="500" font-size="18" fill="#14213D">A phone is charging from the charger in step 1, which gives out a steady 5 volts.</text>
<text x="56" y="528" font-size="18" fill="#14213D">The phone draws a current of 2 amps. What is the phone's effective resistance?</text>
<rect x="56" y="572" width="380" height="258" rx="16" fill="#fff" stroke="#2F9E5A" stroke-width="3"/>
<text x="246" y="610" font-size="18" font-weight="800" fill="#14213D" text-anchor="middle">We want R, so cover R</text>
<polygon points="246,630 156,752 336,752" fill="none" stroke="#14213D" stroke-width="3" stroke-linejoin="round"/>
<line x1="202" y1="692" x2="290" y2="692" stroke="#14213D" stroke-width="3"/>
<line x1="246" y1="692" x2="246" y2="752" stroke="#14213D" stroke-width="3"/>
<text x="246" y="684" font-size="36" font-weight="800" fill="#E8590C" text-anchor="middle">V</text>
<text x="216" y="740" font-size="34" font-weight="800" fill="#1C6DD0" text-anchor="middle">I</text>
<text x="276" y="740" font-size="34" font-weight="800" fill="#8A8574" text-anchor="middle">?</text>
<text x="246" y="780" font-size="14" fill="#5B6478" text-anchor="middle">V is over I → divide</text>
<text x="246" y="814" font-size="30" font-weight="800" fill="#14213D" text-anchor="middle"><tspan fill="#2F9E5A">R</tspan> = <tspan fill="#E8590C">V</tspan> ÷ <tspan fill="#1C6DD0">I</tspan></text>
<rect x="456" y="572" width="568" height="258" rx="16" fill="#14213D"/>
<text x="488" y="610" font-size="22" font-weight="800" fill="#fff">Solution</text>
<circle cx="502" cy="656" r="14" fill="#FBF5E9"/><text x="502" y="662" font-size="16" font-weight="800" fill="#14213D" text-anchor="middle">1</text>
<text x="530" y="646" font-size="14" fill="#EADFCB">Write what you know</text>
<text x="530" y="670" font-size="20" fill="#fff"><tspan fill="#FFB27A">V = 5 V</tspan>,  <tspan fill="#5B9BF0">I = 2 A</tspan></text>
<circle cx="502" cy="702" r="14" fill="#FBF5E9"/><text x="502" y="708" font-size="16" font-weight="800" fill="#14213D" text-anchor="middle">2</text>
<text x="530" y="692" font-size="14" fill="#EADFCB">Choose the formula</text>
<text x="530" y="716" font-size="20" fill="#fff"><tspan fill="#52D6A0">R</tspan> = V ÷ I</text>
<circle cx="502" cy="748" r="14" fill="#FBF5E9"/><text x="502" y="754" font-size="16" font-weight="800" fill="#14213D" text-anchor="middle">3</text>
<text x="530" y="738" font-size="14" fill="#EADFCB">Put in the numbers</text>
<text x="530" y="762" font-size="20" fill="#fff">R = 5 ÷ 2</text>
<circle cx="502" cy="794" r="14" fill="#FBF5E9"/><text x="502" y="800" font-size="16" font-weight="800" fill="#14213D" text-anchor="middle">4</text>
<text x="530" y="784" font-size="14" fill="#EADFCB">Answer with units</text>
<text x="530" y="808" font-size="20" font-weight="800" fill="#52D6A0">R = 2.5 Ω</text>
<rect x="56" y="852" width="968" height="84" rx="16" fill="#fff" stroke="#EADFCB"/>
<text x="84" y="886" font-size="18" fill="#14213D"><tspan font-weight="800" fill="#2F9E5A">Check:</tspan> I × R = 2 A × 2.5 Ω = 5 V ✓ matches the charger</text>
<text x="84" y="914" font-size="13" fill="#5B6478">Simplified: a phone isn't a fixed resistor. The current it draws changes as the battery fills, so 2.5 Ω is its effective resistance at that moment.</text>
</svg>
