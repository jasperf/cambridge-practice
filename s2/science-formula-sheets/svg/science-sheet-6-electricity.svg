<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1200" viewBox="0 0 1080 1200" font-family="Montserrat,Helvetica,Arial,DejaVu Sans,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="1080" height="1200" fill="#FBF5E9"/>
<rect x="0" y="0" width="14" height="1200" fill="#E8590C"/>
<text x="56" y="62" font-size="20" font-weight="700" fill="#E8590C" letter-spacing="2">SECONDARY 2 SCIENCE · SHEET 6 OF 6</text>
<text x="56" y="108" font-size="40" font-weight="800" fill="#14213D">Electricity</text>
<text x="56" y="136" font-size="20" fill="#5B6478">Term 2 · Unit 3</text>
<text x="56" y="172" font-size="24" font-weight="800" fill="#E8590C">Ohm&#x27;s law (V on top; I and R below)</text>
<rect x="56" y="176" width="968" height="0" />
<rect x="56" y="190" width="968" height="162" rx="16" fill="#fff" stroke="#EADFCB"/>
<text x="80" y="230" font-size="21" font-weight="700" fill="#14213D"><tspan x="80" dy="0">Voltage</tspan></text>
<text x="410" y="230" font-size="21" fill="#14213D" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace"><tspan x="410" dy="0">V = I × R   (volts)</tspan></text>
<line x1="80" x2="1000" y1="246" y2="246" stroke="#EADFCB"/>
<text x="80" y="276" font-size="21" font-weight="700" fill="#14213D"><tspan x="80" dy="0">Current</tspan></text>
<text x="410" y="276" font-size="21" fill="#14213D" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace"><tspan x="410" dy="0">I = V ÷ R   (amperes)</tspan></text>
<line x1="80" x2="1000" y1="292" y2="292" stroke="#EADFCB"/>
<text x="80" y="322" font-size="21" font-weight="700" fill="#14213D"><tspan x="80" dy="0">Resistance</tspan></text>
<text x="410" y="322" font-size="21" fill="#14213D" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace"><tspan x="410" dy="0">R = V ÷ I   (ohms)</tspan></text>
<text x="56" y="408" font-size="24" font-weight="800" fill="#E8590C">Meters</text>
<rect x="56" y="412" width="968" height="0" />
<rect x="56" y="426" width="968" height="116" rx="16" fill="#fff" stroke="#EADFCB"/>
<text x="80" y="466" font-size="21" font-weight="700" fill="#14213D"><tspan x="80" dy="0">Ammeter</tspan></text>
<text x="410" y="466" font-size="21" fill="#14213D" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace"><tspan x="410" dy="0">measures current, connected in series</tspan></text>
<line x1="80" x2="1000" y1="482" y2="482" stroke="#EADFCB"/>
<text x="80" y="512" font-size="21" font-weight="700" fill="#14213D"><tspan x="80" dy="0">Voltmeter</tspan></text>
<text x="410" y="512" font-size="21" fill="#14213D" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace"><tspan x="410" dy="0">measures voltage, connected in parallel</tspan></text>
<text x="56" y="598" font-size="24" font-weight="800" fill="#E8590C">Series vs parallel</text>
<rect x="56" y="602" width="968" height="0" />
<rect x="56" y="616" width="968" height="254" rx="16" fill="#fff" stroke="#EADFCB"/>
<text x="80" y="656" font-size="21" font-weight="700" fill="#14213D"><tspan x="80" dy="0">Series current</tspan></text>
<text x="410" y="656" font-size="21" fill="#14213D" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace"><tspan x="410" dy="0">same everywhere</tspan></text>
<line x1="80" x2="1000" y1="672" y2="672" stroke="#EADFCB"/>
<text x="80" y="702" font-size="21" font-weight="700" fill="#14213D"><tspan x="80" dy="0">Series voltage</tspan></text>
<text x="410" y="702" font-size="21" fill="#14213D" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace"><tspan x="410" dy="0">divides between components</tspan></text>
<line x1="80" x2="1000" y1="718" y2="718" stroke="#EADFCB"/>
<text x="80" y="748" font-size="21" font-weight="700" fill="#14213D"><tspan x="80" dy="0">Series resistance</tspan></text>
<text x="410" y="748" font-size="21" fill="#14213D" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace"><tspan x="410" dy="0">R total = R₁ + R₂ + …</tspan></text>
<line x1="80" x2="1000" y1="764" y2="764" stroke="#EADFCB"/>
<text x="80" y="794" font-size="21" font-weight="700" fill="#14213D"><tspan x="80" dy="0">Parallel voltage</tspan></text>
<text x="410" y="794" font-size="21" fill="#14213D" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace"><tspan x="410" dy="0">same across each branch</tspan></text>
<line x1="80" x2="1000" y1="810" y2="810" stroke="#EADFCB"/>
<text x="80" y="840" font-size="21" font-weight="700" fill="#14213D"><tspan x="80" dy="0">Parallel current</tspan></text>
<text x="410" y="840" font-size="21" fill="#14213D" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace"><tspan x="410" dy="0">divides between branches</tspan></text>
<text x="56" y="926" font-size="24" font-weight="800" fill="#E8590C">Quick checks</text>
<rect x="56" y="930" width="968" height="0" />
<rect x="56" y="944" width="968" height="162" rx="16" fill="#fff" stroke="#EADFCB"/>
<text x="80" y="984" font-size="21" font-weight="700" fill="#14213D"><tspan x="80" dy="0">12 V, 3 A</tspan></text>
<text x="410" y="984" font-size="21" fill="#14213D" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace"><tspan x="410" dy="0">R = 4 Ω</tspan></text>
<line x1="80" x2="1000" y1="1000" y2="1000" stroke="#EADFCB"/>
<text x="80" y="1030" font-size="21" font-weight="700" fill="#14213D"><tspan x="80" dy="0">240 V, 10 Ω</tspan></text>
<text x="410" y="1030" font-size="21" fill="#14213D" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace"><tspan x="410" dy="0">I = 24 A</tspan></text>
<line x1="80" x2="1000" y1="1046" y2="1046" stroke="#EADFCB"/>
<text x="80" y="1076" font-size="21" font-weight="700" fill="#14213D"><tspan x="80" dy="0">0.5 A, 16 Ω</tspan></text>
<text x="410" y="1076" font-size="21" fill="#14213D" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace"><tspan x="410" dy="0">V = 8 V</tspan></text>
<text x="56" y="1174" font-size="18" fill="#5B6478">Formula sheets · Jasper</text>
</svg>