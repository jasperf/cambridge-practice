<rect x="602" y="1206" width="28" height="32" fill="#fff"/><line x1="602" x2="630" y1="1210" y2="1210" stroke="#14213D" stroke-width="3"/><line x1="609" x2="623" y1="1232" y2="1232" stroke="#14213D" stroke-width="6"/>
