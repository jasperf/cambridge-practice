<line x1="580" x2="1000" y1="614" y2="614" stroke="#EADFCB"/>
<text x="580" y="640" font-size="19" font-weight="400" fill="#14213D" >Switch open: current is zero</text>
<rect x="56" y="692" width="968" height="44" rx="22" fill="#fff" stroke="#EADFCB"/>
<text x="540" y="721" font-size="20" font-weight="700" fill="#14213D" text-anchor="middle" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">Small units:  1000 mA = 1 A   ·   1000 mV = 1 V</text>
<text x="56" y="790" font-size="24" font-weight="800" fill="#E8590C" >Ohm&#x27;s law (V on top; I and R below)</text>
<rect x="56" y="804" width="968" height="236" rx="16" fill="#fff" stroke="#EADFCB"/>
<polygon points="206,836 81,996 331,996" fill="#FBF5E9" stroke="#14213D" stroke-width="4" stroke-linejoin="round"/>
<line x1="143.5" x2="268.5" y1="916" y2="916" stroke="#14213D" stroke-width="4"/><line x1="206" x2="206" y1="916" y2="996" stroke="#14213D" stroke-width="4"/>
<text x="206" y="902" font-size="40" font-weight="800" fill="#1C6DD0" text-anchor="middle">V</text>
<text x="156" y="970" font-size="40" font-weight="800" fill="#1C6DD0" text-anchor="middle">I</text>
<text x="256" y="970" font-size="40" font-weight="800" fill="#1C6DD0" text-anchor="middle">R</text>
<text x="420" y="868" font-size="28" font-weight="700" fill="#14213D" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">V = I × R</text>
<text x="660" y="868" font-size="18" font-weight="400" fill="#5B6478" >volts = amps × ohms</text>
<text x="420" y="914" font-size="28" font-weight="700" fill="#14213D" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">I = V ÷ R</text>
<text x="660" y="914" font-size="18" font-weight="400" fill="#5B6478" >amps = volts ÷ ohms</text>
<text x="420" y="960" font-size="28" font-weight="700" fill="#14213D" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">R = V ÷ I</text>
<text x="660" y="960" font-size="18" font-weight="400" fill="#5B6478" >ohms = volts ÷ amps</text>
<line x1="420" x2="1000" y1="1000" y2="1000" stroke="#EADFCB"/>
<text x="420" y="1026" font-size="18" font-weight="700" fill="#E8590C" >More resistance means less current for the same voltage.</text>
<text x="56" y="1092" font-size="24" font-weight="800" fill="#E8590C" >Series vs parallel</text>
