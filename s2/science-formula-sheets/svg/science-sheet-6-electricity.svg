<text x="56" y="62" font-size="20" font-weight="700" fill="#E8590C" letter-spacing="2">SECONDARY 2 SCIENCE · SHEET 6 OF 6</text>
<text x="56" y="108" font-size="40" font-weight="800" fill="#14213D" >Electricity</text>
<text x="56" y="136" font-size="20" font-weight="400" fill="#5B6478" >Term 2 · Unit 3 · volts, amps and Ohm&#x27;s law</text>
<text x="56" y="184" font-size="24" font-weight="800" fill="#E8590C" >Volts vs amps: the water-pipe picture</text>
