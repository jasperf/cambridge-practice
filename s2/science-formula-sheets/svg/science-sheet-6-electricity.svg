<text x="580" y="526" font-size="19" font-weight="400" fill="#14213D" >The flow: charge passing each second</text>
<line x1="580" x2="1000" y1="538" y2="538" stroke="#EADFCB"/>
<text x="580" y="564" font-size="19" font-weight="400" fill="#14213D" >Pipe: litres of water per second</text>
