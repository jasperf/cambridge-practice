<text x="540" y="296" font-size="21" font-weight="700" fill="#E8590C" text-anchor="middle">Voltage = the push from the pump (the cell)</text>
<text x="540" y="326" font-size="21" font-weight="700" fill="#1C6DD0" text-anchor="middle">Current = the flow of charge round the pipe</text>
<text x="540" y="352" font-size="17" font-weight="400" fill="#5B6478" text-anchor="middle">Resistor R = a narrow section that slows the flow</text>
<rect x="56" y="436" width="468" height="236" rx="16" fill="#fff" stroke="#EADFCB"/>
<rect x="56" y="436" width="468" height="8" rx="4" fill="#E8590C"/>
<text x="80" y="484" font-size="28" font-weight="800" fill="#E8590C" >Voltage</text>
<text x="500" y="484" font-size="20" font-weight="700" fill="#14213D" text-anchor="end" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace">V · volt (V)</text>
<text x="80" y="526" font-size="19" font-weight="400" fill="#14213D" >The push: energy given to each charge</text>
<line x1="80" x2="500" y1="538" y2="538" stroke="#EADFCB"/>
<text x="80" y="564" font-size="19" font-weight="400" fill="#14213D" >Pipe: the pump&#x27;s pressure</text>
<line x1="80" x2="500" y1="576" y2="576" stroke="#EADFCB"/>
<text x="80" y="602" font-size="19" font-weight="400" fill="#14213D" >Voltmeter, connected in parallel</text>
<line x1="80" x2="500" y1="614" y2="614" stroke="#EADFCB"/>
<text x="80" y="640" font-size="19" font-weight="400" fill="#14213D" >Switch open: cell still has it</text>
