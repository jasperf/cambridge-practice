<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1140" viewBox="0 0 1080 1140" font-family="Montserrat,Helvetica,Arial,DejaVu Sans,sans-serif">
<rect width="1080" height="1140" fill="#FBF5E9"/><rect width="14" height="1140" fill="#E8590C"/>
<text x="56" y="62" font-size="20" fill="#E8590C" font-weight="700" letter-spacing="2">ELECTRICITY · WHO CARRIES THE ENERGY?</text>
<text x="56" y="108" font-size="40" fill="#14213D" font-weight="800">Electrons Are Delivery Vans</text>
<text x="56" y="136" font-size="20" fill="#5B6478">Electrons are not the energy. They carry it round the circuit, like vans carrying parcels.</text>
<rect x="56" y="166" width="968" height="440" rx="16" fill="#fff" stroke="#EADFCB"/>
<text x="84" y="204" font-size="20" fill="#14213D" font-weight="800">Vans on a loop road</text>
<rect x="536" y="189" width="26" height="18" rx="3" fill="#E9EEF6" stroke="#14213D" stroke-width="2"/><g><rect x="540" y="192" width="18" height="12" rx="2" fill="#F5A623" stroke="#B5650A" stroke-width="1.5"/><line x1="549" y1="192" x2="549" y2="204" stroke="#B5650A" stroke-width="1.5"/></g><circle cx="570" cy="198" r="10" fill="#1C6DD0"/><line x1="565" y1="198" x2="575" y2="198" stroke="#fff" stroke-width="2.5"/>
<text x="584" y="203" font-size="14" fill="#14213D" font-weight="700">van = electron</text>
<rect x="730" y="190" width="20" height="14" rx="2" fill="#F5A623" stroke="#B5650A" stroke-width="1.5"/><line x1="740" y1="190" x2="740" y2="204" stroke="#B5650A" stroke-width="1.5"/>
<text x="760" y="203" font-size="14" fill="#14213D" font-weight="700">parcel = energy</text>
