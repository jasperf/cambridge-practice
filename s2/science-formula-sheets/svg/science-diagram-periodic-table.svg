<text x="80" y="816" font-size="16" font-weight="700" fill="#E8590C" text-anchor="start" letter-spacing="1.5">HOW TO READ AN ELECTRONIC STRUCTURE</text>
<text x="100" y="892" font-size="58" font-weight="800" fill="#14213D" text-anchor="middle">2</text>
<text x="137" y="892" font-size="58" font-weight="800" fill="#14213D" text-anchor="middle">,</text>
<text x="175" y="892" font-size="58" font-weight="800" fill="#14213D" text-anchor="middle">8</text>
<text x="212" y="892" font-size="58" font-weight="800" fill="#14213D" text-anchor="middle">,</text>
<text x="250" y="892" font-size="58" font-weight="800" fill="#E8590C" text-anchor="middle">3</text>
<path d="M76 906 v10 H274 v-10" fill="none" stroke="#14213D" stroke-width="3"/>
<text x="175" y="936" font-size="16" font-weight="700" fill="#14213D" text-anchor="middle">3 numbers</text>
<text x="400" y="848" font-size="19" font-weight="400" fill="#14213D" text-anchor="start"><tspan fill="#14213D">3 numbers</tspan> = 3 shells → <tspan font-weight="800">Period 3</tspan></text>
<text x="400" y="876" font-size="19" font-weight="400" fill="#14213D" text-anchor="start"><tspan fill="#E8590C" font-weight="700">last number</tspan> = 3 outer electrons → <tspan font-weight="800">Group 3</tspan></text>
<text x="400" y="908" font-size="20" font-weight="800" fill="#E8590C" text-anchor="start">So 2,8,3 is aluminium (Al), outlined in the table.</text>
<text x="400" y="932" font-size="16" font-weight="400" fill="#5B6478" text-anchor="start">A metal: it loses its 3 outer electrons to form Al³⁺.</text>
<text x="400" y="954" font-size="16" font-weight="400" fill="#5B6478" text-anchor="start">Exception: helium (2) has a full shell, so it is in Group 8.</text>
<text x="56" y="990" font-size="16" font-weight="400" fill="#5B6478" text-anchor="start">Count the numbers → period · read the last number → group</text>
</svg>