<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="962" viewBox="0 0 1080 962" font-family="Montserrat,Helvetica,Arial,DejaVu Sans,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
