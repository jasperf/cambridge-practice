<text x="80" y="572" font-size="21" font-weight="700" fill="#14213D"><tspan x="80" dy="0">Glucose used for</tspan></text>
<text x="410" y="572" font-size="21" fill="#14213D" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace"><tspan x="410" dy="0">respiration, cellulose, starch, proteins, fats</tspan><tspan x="410" dy="30">&amp; oils</tspan></text>
