<line x1="264" x2="300" y1="700" y2="700" stroke="#E8590C" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#mo)"/>
<text x="231" y="786" font-size="13" font-weight="600" fill="#5B6478" text-anchor="middle" >double-glazed window</text>
<text x="430" y="624" font-size="20" font-weight="800" fill="#E8590C" text-anchor="start" letter-spacing="1">CONSERVING HEAT</text>
<text x="430" y="658" font-size="16" font-weight="400" fill="#14213D" text-anchor="start" >Insulation (loft, wall filling, layers of</text>
<text x="430" y="684" font-size="16" font-weight="400" fill="#14213D" text-anchor="start" >clothing) traps air, a poor conductor.</text>
<text x="430" y="710" font-size="16" font-weight="400" fill="#14213D" text-anchor="start" >Double glazing: air or gas between two</text>
<text x="430" y="736" font-size="16" font-weight="400" fill="#14213D" text-anchor="start" >panes, so less heat escapes.</text>
<text x="430" y="764" font-size="16" font-weight="700" fill="#14213D" text-anchor="start" >Result: saves energy, cuts costs, fewer emissions.</text>
<rect x="56" y="816" width="472" height="176" rx="16" fill="#fff" stroke="#EADFCB"/>
<text x="78" y="852" font-size="20" font-weight="800" fill="#E8590C" text-anchor="start" letter-spacing="1">HEAT vs TEMPERATURE</text>
<text x="78" y="886" font-size="16" font-weight="400" fill="#14213D" text-anchor="start" >Heat: energy transferred, in joules (J)</text>
<text x="78" y="914" font-size="16" font-weight="400" fill="#14213D" text-anchor="start" >Temperature: average particle energy, °C</text>
<text x="78" y="942" font-size="16" font-weight="400" fill="#14213D" text-anchor="start" >Heat always flows from hot to cold</text>
<text x="78" y="970" font-size="16" font-weight="400" fill="#14213D" text-anchor="start" >Bigger cup, same °C = more heat</text>
<rect x="552" y="816" width="472" height="176" rx="16" fill="#fff" stroke="#EADFCB"/>
<text x="574" y="852" font-size="20" font-weight="800" fill="#E8590C" text-anchor="start" letter-spacing="1">SPOT THE METHOD</text>
<text x="574" y="886" font-size="16" font-weight="400" fill="#14213D" text-anchor="start" >Spoon warms in hot soup → conduction</text>
<text x="574" y="914" font-size="16" font-weight="400" fill="#14213D" text-anchor="start" >Rising warm water, sinking cool → convection</text>
<text x="574" y="942" font-size="16" font-weight="400" fill="#14213D" text-anchor="start" >Campfire warms your face → radiation</text>
<text x="574" y="970" font-size="16" font-weight="400" fill="#14213D" text-anchor="start" >Heat through empty space → radiation</text>
</svg>