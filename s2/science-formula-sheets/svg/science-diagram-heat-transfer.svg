<path d="M472 262 Q460 262 460 276 V304 Q460 320 478 320 H514" fill="none" stroke="#1C6DD0" stroke-width="4" marker-end="url(#mb)"/>
<text x="538" y="246" font-size="13" font-weight="700" fill="#D9381E" text-anchor="middle" >warm rises</text>
<text x="448" y="372" font-size="13" font-weight="700" fill="#1C6DD0" text-anchor="middle" >cool sinks</text>
<text x="628" y="372" font-size="13" font-weight="700" fill="#1C6DD0" text-anchor="middle" >cool sinks</text>
<text x="408" y="424" font-size="15" font-weight="400" fill="#14213D" text-anchor="start" >Warm fluid is less dense,</text>
<text x="408" y="446" font-size="15" font-weight="400" fill="#14213D" text-anchor="start" >so it rises; cool, denser</text>
<text x="408" y="468" font-size="15" font-weight="400" fill="#14213D" text-anchor="start" >fluid sinks. A loop forms.</text>
<text x="408" y="490" font-size="15" font-weight="400" fill="#14213D" text-anchor="start" >Liquids and gases only.</text>
<text x="408" y="528" font-size="15" font-weight="700" fill="#E8590C" text-anchor="start" >e.g. water heating in a pot</text>
