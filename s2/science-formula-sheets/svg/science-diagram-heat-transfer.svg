<text x="231" y="372" font-size="14" font-weight="600" fill="#5B6478" text-anchor="middle" >heat flows hot → cold</text>
<text x="76" y="424" font-size="15" font-weight="400" fill="#14213D" text-anchor="start" >Particles vibrate and pass</text>
<text x="76" y="446" font-size="15" font-weight="400" fill="#14213D" text-anchor="start" >energy on by direct contact.</text>
<text x="76" y="468" font-size="15" font-weight="400" fill="#14213D" text-anchor="start" >Mainly solids; metals best.</text>
<text x="76" y="490" font-size="15" font-weight="400" fill="#14213D" text-anchor="start" >Needs particles touching.</text>
<text x="76" y="528" font-size="15" font-weight="700" fill="#E8590C" text-anchor="start" >e.g. spoon in hot soup</text>
<rect x="430" y="256" width="216" height="98" rx="16" fill="#DCEBFA" stroke="#14213D" stroke-width="3"/>
<path d="M538 358 C522 344 528 330 538 320 C540 332 552 334 548 320 C564 334 566 350 550 358 Z" fill="#F5A623" stroke="#E8590C" stroke-width="2"/>
