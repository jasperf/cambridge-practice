<text x="56" y="62" font-size="20" font-weight="700" fill="#E8590C" letter-spacing="2">SECONDARY 2 SCIENCE · DIAGRAM</text>
<text x="56" y="108" font-size="40" font-weight="800" fill="#14213D">How Heat Travels</text>
<text x="56" y="136" font-size="20" fill="#5B6478">Term 2 · Unit 3 · Conduction, convection, radiation and insulation</text>
<rect x="56" y="160" width="304" height="400" rx="16" fill="#fff" stroke="#EADFCB"/>
<circle cx="86" cy="196" r="14" fill="#E8590C"/>
<text x="86" y="202" font-size="16" font-weight="800" fill="#fff" text-anchor="middle" >1</text>
<text x="110" y="202" font-size="22" font-weight="800" fill="#14213D" text-anchor="start" >CONDUCTION</text>
<text x="76" y="226" font-size="14" font-weight="400" fill="#5B6478" text-anchor="start" >through direct contact</text>
<line x1="76" x2="340" y1="398" y2="398" stroke="#EADFCB"/>
<rect x="388" y="160" width="304" height="400" rx="16" fill="#fff" stroke="#EADFCB"/>
<circle cx="418" cy="196" r="14" fill="#E8590C"/>
<text x="418" y="202" font-size="16" font-weight="800" fill="#fff" text-anchor="middle" >2</text>
<text x="442" y="202" font-size="22" font-weight="800" fill="#14213D" text-anchor="start" >CONVECTION</text>
<text x="408" y="226" font-size="14" font-weight="400" fill="#5B6478" text-anchor="start" >in moving liquids and gases</text>
<line x1="408" x2="672" y1="398" y2="398" stroke="#EADFCB"/>
<rect x="720" y="160" width="304" height="400" rx="16" fill="#fff" stroke="#EADFCB"/>
