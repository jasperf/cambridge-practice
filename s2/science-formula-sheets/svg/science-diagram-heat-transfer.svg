<text x="321" y="648" font-size="14" font-weight="700" fill="#1C6DD0" text-anchor="middle" >cold outside</text>
<text x="231" y="614" font-size="14" font-weight="700" fill="#5B6478" text-anchor="middle" >trapped air</text>
<line x1="90" x2="198" y1="700" y2="700" stroke="#E8590C" stroke-width="7" marker-end="url(#mo)"/>
