<text x="750" y="202" font-size="16" font-weight="800" fill="#fff" text-anchor="middle" >3</text>
<text x="774" y="202" font-size="22" font-weight="800" fill="#14213D" text-anchor="start" >RADIATION</text>
<text x="740" y="226" font-size="14" font-weight="400" fill="#5B6478" text-anchor="start" >as infrared waves</text>
<line x1="740" x2="1004" y1="398" y2="398" stroke="#EADFCB"/>
