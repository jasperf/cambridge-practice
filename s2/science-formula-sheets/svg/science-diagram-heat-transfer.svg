<text x="890" y="360" font-size="13" font-weight="600" fill="#5B6478" text-anchor="middle" font-style="italic">vacuum (no particles)</text>
<text x="740" y="424" font-size="15" font-weight="400" fill="#14213D" text-anchor="start" >Infrared waves carry heat.</text>
<text x="740" y="446" font-size="15" font-weight="400" fill="#14213D" text-anchor="start" >No particles needed, so it</text>
<text x="740" y="468" font-size="15" font-weight="400" fill="#14213D" text-anchor="start" >works through a vacuum.</text>
<text x="740" y="490" font-size="15" font-weight="400" fill="#14213D" text-anchor="start" >How the Sun warms Earth.</text>
<text x="740" y="528" font-size="15" font-weight="700" fill="#E8590C" text-anchor="start" >e.g. campfire on your face</text>
