<text x="937" y="406" font-size="18" fill="#1C6DD0" font-weight="800" text-anchor="middle">XY</text>
<text x="250" y="410" font-size="14" fill="#5B6478">pairs 1–22: autosomes (eye colour, hair, height …)</text>
<text x="937" y="426" font-size="13" fill="#5B6478" font-weight="700" text-anchor="middle">pair 23</text>
<rect x="56" y="460" width="560" height="470" rx="16" fill="#fff" stroke="#EADFCB"/><text x="84" y="498" font-size="20" fill="#14213D" font-weight="800">Each baby: a 50 : 50 chance</text>

<text x="386" y="524" font-size="16" fill="#1C6DD0" font-weight="800" text-anchor="middle">Dad's sperm</text>
<text x="170" y="726" font-size="16" fill="#D6336C" font-weight="800" text-anchor="middle" transform="rotate(-90 170 720)">Mum's eggs</text>
<text x="311" y="556" font-size="26" fill="#1C6DD0" font-weight="800" text-anchor="middle">X</text>
<text x="461" y="556" font-size="26" fill="#1C6DD0" font-weight="800" text-anchor="middle">Y</text>
<text x="212" y="654" font-size="26" fill="#D6336C" font-weight="800" text-anchor="middle">X</text>
