<text x="461" y="636" font-size="32" font-weight="800" text-anchor="middle"><tspan fill="#D6336C">X</tspan><tspan fill="#1C6DD0">Y</tspan></text>
<text x="461" y="672" font-size="20" fill="#1C6DD0" font-weight="800" text-anchor="middle">boy</text>
<text x="212" y="804" font-size="26" fill="#D6336C" font-weight="800" text-anchor="middle">X</text>
<rect x="236" y="720" width="150" height="150" fill="#FFF0F6" stroke="#14213D" stroke-width="2"/>
<text x="311" y="786" font-size="32" font-weight="800" text-anchor="middle"><tspan fill="#D6336C">X</tspan><tspan fill="#D6336C">X</tspan></text>
<text x="311" y="822" font-size="20" fill="#D6336C" font-weight="800" text-anchor="middle">girl</text>
<rect x="386" y="720" width="150" height="150" fill="#E7F5FF" stroke="#14213D" stroke-width="2"/>
<text x="461" y="786" font-size="32" font-weight="800" text-anchor="middle"><tspan fill="#D6336C">X</tspan><tspan fill="#1C6DD0">Y</tspan></text>
<text x="461" y="822" font-size="20" fill="#1C6DD0" font-weight="800" text-anchor="middle">boy</text>
<rect x="386" y="570" width="150" height="300" fill="none" stroke="#F5A623" stroke-width="5"><animate attributeName="opacity" values="0;1;0" dur="2.4s" repeatCount="indefinite"/></rect>
<text x="336" y="910" font-size="18" fill="#14213D" font-weight="800" text-anchor="middle">2 girls : 2 boys = 50% each</text>
<rect x="632" y="460" width="392" height="470" rx="16" fill="#fff" stroke="#EADFCB"/><text x="660" y="498" font-size="20" fill="#14213D" font-weight="800">The sperm decides</text>

<circle cx="930" cy="710" r="60" fill="#FFF0F6" stroke="#D6336C" stroke-width="3"/>
<text x="930" y="720" font-size="30" fill="#D6336C" font-weight="800" text-anchor="middle">X</text>
<text x="930" y="800" font-size="15" fill="#D6336C" font-weight="800" text-anchor="middle">every egg: X</text>
<g><ellipse cx="0" cy="0" rx="16" ry="11" fill="#1C6DD0"/><text x="0" y="5" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">X</text><path fill="none" stroke="#1C6DD0" stroke-width="3" stroke-linecap="round" d="M-14,0 C-26,-8 -34,8 -46,0 S-64,-8 -74,0"><animate attributeName="d" dur="0.5s" repeatCount="indefinite" values="M-14,0 C-26,-8 -34,8 -46,0 S-64,-8 -74,0;M-14,0 C-26,8 -34,-8 -46,0 S-64,8 -74,0;M-14,0 C-26,-8 -34,8 -46,0 S-64,-8 -74,0"/></path><animateMotion dur="6s" begin="0s" repeatCount="indefinite" keyTimes="0;0.5;1" keyPoints="0;1;1" calcMode="linear" path="M720,640 C770,668.0 820,675.0 858,678"/></g>
<g><ellipse cx="0" cy="0" rx="16" ry="11" fill="#1C6DD0"/><text x="0" y="5" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">Y</text><path fill="none" stroke="#1C6DD0" stroke-width="3" stroke-linecap="round" d="M-14,0 C-26,-8 -34,8 -46,0 S-64,-8 -74,0"><animate attributeName="d" dur="0.5s" repeatCount="indefinite" values="M-14,0 C-26,-8 -34,8 -46,0 S-64,-8 -74,0;M-14,0 C-26,8 -34,-8 -46,0 S-64,8 -74,0;M-14,0 C-26,-8 -34,8 -46,0 S-64,-8 -74,0"/></path><animateMotion dur="6s" begin="-3s" repeatCount="indefinite" keyTimes="0;0.5;1" keyPoints="0;1;1" calcMode="linear" path="M720,780 C770,752.0 820,745.0 858,742"/></g>
<text x="700" y="610" font-size="15" fill="#1C6DD0" font-weight="800">sperm with X</text>
<text x="700" y="830" font-size="15" fill="#1C6DD0" font-weight="800">sperm with Y</text>
<text x="660" y="532" font-size="15" fill="#5B6478"><tspan x="660" dy="0">Half of Dad's sperm carry an X, half</tspan><tspan x="660" dy="21">carry a Y. Mum can only give an X.</tspan></text>
<text x="660" y="870" font-size="16" fill="#D6336C" font-weight="800">X sperm + X egg → XX girl</text>
<text x="660" y="896" font-size="16" fill="#1C6DD0" font-weight="800">Y sperm + X egg → XY boy</text>
<rect x="56" y="954" width="968" height="190" rx="16" fill="#fff" stroke="#EADFCB"/><text x="84" y="992" font-size="20" fill="#14213D" font-weight="800">Remember</text>

<circle cx="92" cy="1032" r="6" fill="#2F9E44"/><text x="110" y="1038" font-size="17" fill="#14213D">Female = XX, male = XY. The Y chromosome is much smaller than the X.</text>
<circle cx="92" cy="1070" r="6" fill="#2F9E44"/><text x="110" y="1076" font-size="17" fill="#14213D">Eggs all carry X, so the egg can't decide. Sperm carry X or Y, so the father's sperm decides.</text>
<circle cx="92" cy="1108" r="6" fill="#2F9E44"/><text x="110" y="1114" font-size="17" fill="#14213D">Each fertilisation is a new 50 : 50 chance. Earlier children make no difference: no baby is ever 'due'.</text>
</svg>
