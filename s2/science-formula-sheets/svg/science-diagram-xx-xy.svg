<text x="56" y="108" font-size="40" fill="#14213D" font-weight="800">XX and XY</text>
<text x="56" y="136" font-size="20" fill="#5B6478">Pair 23 decides. The egg always brings an X; the sperm brings an X or a Y.</text>

