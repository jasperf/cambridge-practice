<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1086" viewBox="0 0 1080 1086" font-family="Montserrat,Helvetica,Arial,DejaVu Sans,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="1080" height="1086" fill="#FBF5E9"/>
<rect x="0" y="0" width="14" height="1086" fill="#E8590C"/>
<text x="56" y="62" font-size="20" font-weight="700" fill="#E8590C" letter-spacing="2">SECONDARY 2 SCIENCE · SHEET 5 OF 6</text>
<text x="56" y="108" font-size="40" font-weight="800" fill="#14213D">Waves, Sound &amp; Thermal Energy</text>
<text x="56" y="136" font-size="20" fill="#5B6478">Term 2 · Unit 3</text>
<text x="56" y="172" font-size="24" font-weight="800" fill="#E8590C">Wave formulas</text>
<rect x="56" y="176" width="968" height="0" />
<rect x="56" y="190" width="968" height="254" rx="16" fill="#fff" stroke="#EADFCB"/>
<text x="80" y="230" font-size="21" font-weight="700" fill="#14213D"><tspan x="80" dy="0">Period</tspan></text>
<text x="410" y="230" font-size="21" fill="#14213D" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace"><tspan x="410" dy="0">T = 1 ÷ f   (seconds)</tspan></text>
<line x1="80" x2="1000" y1="246" y2="246" stroke="#EADFCB"/>
<text x="80" y="276" font-size="21" font-weight="700" fill="#14213D"><tspan x="80" dy="0">Frequency</tspan></text>
<text x="410" y="276" font-size="21" fill="#14213D" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace"><tspan x="410" dy="0">f = 1 ÷ T   (hertz, Hz)</tspan></text>
<line x1="80" x2="1000" y1="292" y2="292" stroke="#EADFCB"/>
<text x="80" y="322" font-size="21" font-weight="700" fill="#14213D"><tspan x="80" dy="0">Amplitude</tspan></text>
<text x="410" y="322" font-size="21" fill="#14213D" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace"><tspan x="410" dy="0">middle line to crest: bigger = louder</tspan></text>
<line x1="80" x2="1000" y1="338" y2="338" stroke="#EADFCB"/>
<text x="80" y="368" font-size="21" font-weight="700" fill="#14213D"><tspan x="80" dy="0">Frequency effect</tspan></text>
<text x="410" y="368" font-size="21" fill="#14213D" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace"><tspan x="410" dy="0">higher frequency = higher pitch</tspan></text>
<line x1="80" x2="1000" y1="384" y2="384" stroke="#EADFCB"/>
<text x="80" y="414" font-size="21" font-weight="700" fill="#14213D"><tspan x="80" dy="0">Wavelength</tspan></text>
<text x="410" y="414" font-size="21" fill="#14213D" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace"><tspan x="410" dy="0">distance between consecutive crests</tspan></text>
<text x="56" y="500" font-size="24" font-weight="800" fill="#E8590C">Interference</text>
<rect x="56" y="504" width="968" height="0" />
<rect x="56" y="518" width="968" height="146" rx="16" fill="#fff" stroke="#EADFCB"/>
<text x="80" y="558" font-size="21" font-weight="700" fill="#14213D"><tspan x="80" dy="0">Constructive</tspan></text>
<text x="410" y="558" font-size="21" fill="#14213D" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace"><tspan x="410" dy="0">crest + crest: amplitudes add (2 cm + 3 cm = 5</tspan><tspan x="410" dy="30">cm)</tspan></text>
<line x1="80" x2="1000" y1="604" y2="604" stroke="#EADFCB"/>
<text x="80" y="634" font-size="21" font-weight="700" fill="#14213D"><tspan x="80" dy="0">Destructive</tspan></text>
<text x="410" y="634" font-size="21" fill="#14213D" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace"><tspan x="410" dy="0">crest + trough: amplitudes cancel</tspan></text>
<text x="56" y="720" font-size="24" font-weight="800" fill="#E8590C">Thermal energy</text>
<rect x="56" y="724" width="968" height="0" />
<rect x="56" y="738" width="968" height="254" rx="16" fill="#fff" stroke="#EADFCB"/>
<text x="80" y="778" font-size="21" font-weight="700" fill="#14213D"><tspan x="80" dy="0">Heat</tspan></text>
<text x="410" y="778" font-size="21" fill="#14213D" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace"><tspan x="410" dy="0">energy transfer, measured in joules (J)</tspan></text>
<line x1="80" x2="1000" y1="794" y2="794" stroke="#EADFCB"/>
<text x="80" y="824" font-size="21" font-weight="700" fill="#14213D"><tspan x="80" dy="0">Temperature</tspan></text>
<text x="410" y="824" font-size="21" fill="#14213D" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace"><tspan x="410" dy="0">average kinetic energy of particles, °C</tspan></text>
<line x1="80" x2="1000" y1="840" y2="840" stroke="#EADFCB"/>
<text x="80" y="870" font-size="21" font-weight="700" fill="#14213D"><tspan x="80" dy="0">Conduction</tspan></text>
<text x="410" y="870" font-size="21" fill="#14213D" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace"><tspan x="410" dy="0">contact, solids (metals best)</tspan></text>
<line x1="80" x2="1000" y1="886" y2="886" stroke="#EADFCB"/>
<text x="80" y="916" font-size="21" font-weight="700" fill="#14213D"><tspan x="80" dy="0">Convection</tspan></text>
<text x="410" y="916" font-size="21" fill="#14213D" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace"><tspan x="410" dy="0">fluids: warm rises, cool sinks</tspan></text>
<line x1="80" x2="1000" y1="932" y2="932" stroke="#EADFCB"/>
<text x="80" y="962" font-size="21" font-weight="700" fill="#14213D"><tspan x="80" dy="0">Radiation</tspan></text>
<text x="410" y="962" font-size="21" fill="#14213D" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace"><tspan x="410" dy="0">infrared, works in a vacuum</tspan></text>
<text x="56" y="1060" font-size="18" fill="#5B6478">Formula sheets · Jasper</text>
</svg>