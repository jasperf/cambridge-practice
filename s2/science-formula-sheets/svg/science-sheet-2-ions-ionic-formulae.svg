<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1070" viewBox="0 0 1080 1070" font-family="Montserrat,Helvetica,Arial,DejaVu Sans,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="1080" height="1070" fill="#FBF5E9"/>
<rect x="0" y="0" width="14" height="1070" fill="#E8590C"/>
<text x="56" y="62" font-size="20" font-weight="700" fill="#E8590C" letter-spacing="2">SECONDARY 2 SCIENCE · SHEET 2 OF 6</text>
<text x="56" y="108" font-size="40" font-weight="800" fill="#14213D">Ions &amp; Ionic Formulae</text>
<text x="56" y="136" font-size="20" fill="#5B6478">Term 1 · Unit 1</text>
<text x="56" y="172" font-size="24" font-weight="800" fill="#E8590C">Forming ions</text>
<rect x="56" y="176" width="968" height="0" />
<rect x="56" y="190" width="968" height="176" rx="16" fill="#fff" stroke="#EADFCB"/>
<text x="80" y="230" font-size="21" font-weight="700" fill="#14213D"><tspan x="80" dy="0">Groups 1–3</tspan></text>
<text x="410" y="230" font-size="21" fill="#14213D" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace"><tspan x="410" dy="0">lose electrons (number lost = group no.) →</tspan><tspan x="410" dy="30">positive: Na⁺, Mg²⁺, Al³⁺</tspan></text>
<line x1="80" x2="1000" y1="276" y2="276" stroke="#EADFCB"/>
<text x="80" y="306" font-size="21" font-weight="700" fill="#14213D"><tspan x="80" dy="0">Groups 6–7</tspan></text>
<text x="410" y="306" font-size="21" fill="#14213D" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace"><tspan x="410" dy="0">gain electrons (gained = 8 − group no.) →</tspan><tspan x="410" dy="30">negative: O²⁻, Cl⁻</tspan></text>
<text x="56" y="422" font-size="24" font-weight="800" fill="#E8590C">Rule: total + charge = total − charge</text>
<rect x="56" y="426" width="968" height="0" />
<rect x="56" y="440" width="968" height="300" rx="16" fill="#fff" stroke="#EADFCB"/>
<text x="80" y="480" font-size="21" font-weight="700" fill="#14213D"><tspan x="80" dy="0">Na⁺ + Cl⁻</tspan></text>
<text x="410" y="480" font-size="21" fill="#14213D" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace"><tspan x="410" dy="0">→ NaCl</tspan></text>
<line x1="80" x2="1000" y1="496" y2="496" stroke="#EADFCB"/>
<text x="80" y="526" font-size="21" font-weight="700" fill="#14213D"><tspan x="80" dy="0">Mg²⁺ + 2Cl⁻</tspan></text>
<text x="410" y="526" font-size="21" fill="#14213D" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace"><tspan x="410" dy="0">→ MgCl₂</tspan></text>
<line x1="80" x2="1000" y1="542" y2="542" stroke="#EADFCB"/>
<text x="80" y="572" font-size="21" font-weight="700" fill="#14213D"><tspan x="80" dy="0">2Li⁺ + O²⁻</tspan></text>
<text x="410" y="572" font-size="21" fill="#14213D" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace"><tspan x="410" dy="0">→ Li₂O</tspan></text>
<line x1="80" x2="1000" y1="588" y2="588" stroke="#EADFCB"/>
<text x="80" y="618" font-size="21" font-weight="700" fill="#14213D"><tspan x="80" dy="0">Ca²⁺ + 2Cl⁻</tspan></text>
<text x="410" y="618" font-size="21" fill="#14213D" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace"><tspan x="410" dy="0">→ CaCl₂</tspan></text>
<line x1="80" x2="1000" y1="634" y2="634" stroke="#EADFCB"/>
<text x="80" y="664" font-size="21" font-weight="700" fill="#14213D"><tspan x="80" dy="0">Ca²⁺ + O²⁻</tspan></text>
<text x="410" y="664" font-size="21" fill="#14213D" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace"><tspan x="410" dy="0">→ CaO</tspan></text>
<line x1="80" x2="1000" y1="680" y2="680" stroke="#EADFCB"/>
<text x="80" y="710" font-size="21" font-weight="700" fill="#14213D"><tspan x="80" dy="0">2Al³⁺ + 3O²⁻</tspan></text>
<text x="410" y="710" font-size="21" fill="#14213D" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace"><tspan x="410" dy="0">→ Al₂O₃</tspan></text>
<text x="56" y="796" font-size="24" font-weight="800" fill="#E8590C">Bonding types</text>
<rect x="56" y="800" width="968" height="0" />
<rect x="56" y="814" width="968" height="162" rx="16" fill="#fff" stroke="#EADFCB"/>
<text x="80" y="854" font-size="21" font-weight="700" fill="#14213D"><tspan x="80" dy="0">Ionic</tspan></text>
<text x="410" y="854" font-size="21" fill="#14213D" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace"><tspan x="410" dy="0">electrons transferred (metal + non-metal)</tspan></text>
<line x1="80" x2="1000" y1="870" y2="870" stroke="#EADFCB"/>
<text x="80" y="900" font-size="21" font-weight="700" fill="#14213D"><tspan x="80" dy="0">Covalent</tspan></text>
<text x="410" y="900" font-size="21" fill="#14213D" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace"><tspan x="410" dy="0">electrons shared (two non-metals): F₂, H₂O</tspan></text>
<line x1="80" x2="1000" y1="916" y2="916" stroke="#EADFCB"/>
<text x="80" y="946" font-size="21" font-weight="700" fill="#14213D"><tspan x="80" dy="0">Metallic</tspan></text>
<text x="410" y="946" font-size="21" fill="#14213D" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace"><tspan x="410" dy="0">sea of free electrons between metal atoms</tspan></text>
<text x="56" y="1044" font-size="18" fill="#5B6478">Formula sheets · Jasper</text>
</svg>